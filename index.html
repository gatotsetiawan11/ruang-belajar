<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Masuk - Ruang Belajar</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>


<body class="auth-page">


<main class="auth-shell">


<section class="auth-card">


<div class="auth-brand">

    <div class="auth-logo">
        RB
    </div>

    <div>
        <h1>Ruang Belajar</h1>
        <p>
            Belajar dan berlatih sesuai kemampuanmu.
        </p>
    </div>

</div>



<section class="auth-section">


<div class="auth-heading">

<span class="auth-badge">
    Masuk
</span>

<h2>
    Selamat Datang
</h2>

<p>
Gunakan identitas akun kamu untuk masuk.
</p>


</div>



<form id="loginForm" autocomplete="off">


<div class="form-group">

<label>
Jenis Identitas
</label>


<select 
id="identityType"
class="auth-input">


<option value="nisn">
NISN
</option>


<option value="email">
Email
</option>


<option value="whatsapp">
WhatsApp
</option>


</select>

</div>




<div class="form-group">

<label id="identityLabel">
NISN
</label>


<input

id="identityInput"

class="auth-input"

type="text"

placeholder="Masukkan NISN"

required

>


</div>




<div class="form-group">


<label>
PIN
</label>


<input

id="pinInput"

class="auth-input"

type="password"

inputmode="numeric"

maxlength="6"

placeholder="Masukkan PIN"

required

>


</div>




<div id="loginMessage"
class="auth-message"
hidden>
</div>



<button

class="auth-primary-button"

type="submit"

>

Masuk

</button>


</form>



<div class="auth-secondary-action">

<a href="register.html">

Belum punya akun? Daftar

</a>

</div>


</section>


</section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/login.js"></script>


</body>

</html>
