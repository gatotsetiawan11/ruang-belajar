<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IPAS Bab 1</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 20px auto; padding: 0 15px; background: #f4f7fc; }
        .kartu { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1 { color: #333; text-align: center; }
        .level-btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .level-btn.aktif { background: #4CAF50; color: white; }
        .soal { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .opsi { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; background: white; font-size: 1em; }
        .opsi:hover { border-color: #4CAF50; }
        .opsi.benar { border-color: #4CAF50; background: #e8f5e9; }
        .opsi.salah { border-color: #f44336; background: #ffebee; }
        .opsi:disabled { cursor: not-allowed; }
        button { padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .btn-lanjut { background: #2196F3; color: white; margin-top: 15px; width: 100%; }
        .hasil { text-align: center; font-size: 1.3em; margin: 20px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>📝 Latihan IPAS Bab 1: Keajaiban Tubuhku</h1>

    <!-- Level Selection -->
    <div class="kartu" id="pilihLevel">
        <h3>Pilih Level Soal:</h3>
        <div id="tombolLevel"></div>
        <p id="infoLevel" style="color:#666;"></p>
        <button id="btnMulai" style="background:#4CAF50;color:white;width:100%;padding:15px;font-size:1.1em;">🚀 Mulai Latihan</button>
    </div>

    <!-- Quiz Area -->
    <div class="kartu hidden" id="areaKuis">
        <div class="soal" id="teksSoal"></div>
        <div id="opsiContainer"></div>
        <div id="feedback" style="margin-top:15px;font-weight:bold;padding:10px;border-radius:8px;"></div>
        <button class="btn-lanjut hidden" id="btnLanjut">➡️ Soal Berikutnya</button>
    </div>

    <!-- Result Area -->
    <div class="kartu hidden" id="areaHasil">
        <h2>🏆 Hasil</h2>
        <div class="hasil" id="skorHasil"></div>
        <button onclick="resetSemua()" style="background:#ff9800;color:white;">🔄 Ulangi</button>
        <a href="dashboard.html"><button style="background:#607D8B;color:white;">🏠 Dashboard</button></a>
    </div>

    <!-- LOAD FILE SOAL -->
    <script src="soal-IPAS-Bab1.js"></script>

    <script>
        // ============================================
        // VARIABEL GLOBAL
        // ============================================
        const bankData = bankSoalIPASBab1;  // ambil variabel dari file soal
        const levelKonfig = [
            { kode: 'C1', nama: 'Mengingat' },
            { kode: 'C2', nama: 'Memahami' },
            { kode: 'C3', nama: 'Mengaplikasi' },
            { kode: 'C4', nama: 'Menganalisis' },
            { kode: 'C5', nama: 'Mengevaluasi' }
        ];

        let levelAktif = 'C1';
        let daftarSoal = [];
        let indexSoal = 0;
        let skor = 0;
        let statusJawab = false; // agar tidak bisa jawab 2x

        // ============================================
        // TAMPILKAN TOMBOL LEVEL
        // ============================================
        function renderLevelButtons() {
            const container = document.getElementById('tombolLevel');
            container.innerHTML = '';
            
            levelKonfig.forEach(lv => {
                const jml = (bankData[lv.kode] || []).length;
                const btn = document.createElement('button');
                btn.className = 'level-btn' + (lv.kode === 'C1' ? ' aktif' : '');
                btn.textContent = `${lv.kode} (${jml} soal)`;
                btn.style.marginBottom = '5px';
                
                if (jml === 0) {
                    btn.disabled = true;
                    btn.style.opacity = '0.4';
                } else {
                    btn.onclick = () => {
                        levelAktif = lv.kode;
                        // update class aktif
                        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('aktif'));
                        btn.classList.add('aktif');
                        document.getElementById('infoLevel').textContent = 
                            `Level ${lv.kode} (${lv.nama}) - ${jml} soal tersedia. Anda akan mengerjakan 10 soal.`;
                    };
                }
                container.appendChild(btn);
            });

            // Set info awal
            const lvPertama = levelKonfig.find(lv => bankData[lv.kode] && bankData[lv.kode].length > 0);
            if (lvPertama) {
                document.getElementById('infoLevel').textContent = 
                    `Level ${lvPertama.kode} (${lvPertama.nama}) - ${bankData[lvPertama.kode].length} soal tersedia. Anda akan mengerjakan 10 soal.`;
            }
        }

        // ============================================
        // MULAI LATIHAN
        // ============================================
        document.getElementById('btnMulai').addEventListener('click', function() {
            const semuaSoal = bankData[levelAktif] || [];
            if (semuaSoal.length === 0) {
                alert('Tidak ada soal untuk level ini!');
                return;
            }

            // Acak soal
            const acak = [...semuaSoal].sort(() => Math.random() - 0.5);
            daftarSoal = acak.slice(0, 10); // ambil 10 soal

            indexSoal = 0;
            skor = 0;
            statusJawab = false;

            // Pindah tampilan
            document.getElementById('pilihLevel').classList.add('hidden');
            document.getElementById('areaHasil').classList.add('hidden');
            document.getElementById('areaKuis').classList.remove('hidden');
            document.getElementById('btnLanjut').classList.add('hidden');

            tampilkanSoal();
        });

        // ============================================
        // TAMPILKAN SOAL
        // ============================================
        function tampilkanSoal() {
            const soal = daftarSoal[indexSoal];
            const total = daftarSoal.length;

            document.getElementById('teksSoal').textContent = 
                `Soal ${indexSoal + 1}/${total}: ${soal.soal}`;

            // Tampilkan opsi
            const container = document.getElementById('opsiContainer');
            container.innerHTML = '';
            const huruf = ['A', 'B', 'C', 'D'];

            soal.pilihan.forEach((pil, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opsi';
                btn.textContent = `${huruf[idx]}. ${pil}`;
                btn.onclick = () => jawab(idx, btn);
                container.appendChild(btn);
            });

            // Reset feedback
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').style.backgroundColor = '';
            statusJawab = false;
        }

        // ============================================
        // JAWAB SOAL
        // ============================================
        function jawab(idxPilihan, tombol) {
            if (statusJawab) return; // sudah menjawab
            statusJawab = true;

            const soal = daftarSoal[indexSoal];
            const semuaTombol = document.querySelectorAll('.opsi');

            // Nonaktifkan semua
            semuaTombol.forEach(b => b.disabled = true);

            // Tandai benar/salah
            if (idxPilihan === soal.kunci) {
                skor++;
                tombol.classList.add('benar');
                document.getElementById('feedback').textContent = '✅ Benar!';
                document.getElementById('feedback').style.backgroundColor = '#e8f5e9';
                document.getElementById('feedback').style.color = '#2e7d32';
            } else {
                tombol.classList.add('salah');
                // Tandai jawaban yang benar
                semuaTombol.forEach((b, i) => {
                    if (i === soal.kunci) b.classList.add('benar');
                });
                document.getElementById('feedback').textContent = `❌ Salah. Jawaban benar: ${soal.pilihan[soal.kunci]}`;
                document.getElementById('feedback').style.backgroundColor = '#ffebee';
                document.getElementById('feedback').style.color = '#c62828';
            }

            // Tampilkan tombol lanjut
            const btnLanjut = document.getElementById('btnLanjut');
            btnLanjut.classList.remove('hidden');
            
            if (indexSoal === daftarSoal.length - 1) {
                btnLanjut.textContent = '✅ Lihat Hasil';
            } else {
                btnLanjut.textContent = '➡️ Soal Berikutnya';
            }
        }

        // ============================================
        // TOMBOL LANJUT
        // ============================================
        document.getElementById('btnLanjut').addEventListener('click', function() {
            if (indexSoal < daftarSoal.length - 1) {
                indexSoal++;
                document.getElementById('btnLanjut').classList.add('hidden');
                tampilkanSoal();
            } else {
                // Tampilkan hasil
                document.getElementById('areaKuis').classList.add('hidden');
                document.getElementById('areaHasil').classList.remove('hidden');
                const total = daftarSoal.length;
                const pct = (skor / total) * 100;
                let pesan = '';
                if (pct >= 90) pesan = '🌟 Sempurna!';
                else if (pct >= 75) pesan = '👍 Bagus!';
                else if (pct >= 60) pesan = '😊 Cukup baik.';
                else if (pct >= 40) pesan = '💪 Terus berlatih!';
                else pesan = '📖 Baca lagi materinya.';
                
                document.getElementById('skorHasil').innerHTML = 
                    `<div style="font-size:3em;">${skor}/${total}</div>
                     <div style="font-size:1.2em;margin-top:10px;">${pesan}</div>
                     <div>Nilai: ${Math.round(pct)} • Level: ${levelAktif}</div>`;
            }
        });

        // ============================================
        // RESET
        // ============================================
        function resetSemua() {
            document.getElementById('areaHasil').classList.add('hidden');
            document.getElementById('areaKuis').classList.add('hidden');
            document.getElementById('pilihLevel').classList.remove('hidden');
            renderLevelButtons();
        }

        // ============================================
        // INISIALISASI
        // ============================================
        // Cek apakah data ada
        if (!bankData) {
            document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">ERROR: Variabel bankSoalIPASBab1 tidak ditemukan!<br>Pastikan file soal-IPAS-Bab1.js dimuat dengan benar.</h2>';
        } else {
            renderLevelButtons();
        }
    </script>

</body>
</html>
