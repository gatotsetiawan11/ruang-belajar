<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IPAS Bab 1</title>
    <style>
        /* ========== RESET & BODY ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);

        }

        /* ========== ANIMASI BINTANG ========== */
        .stars, .twinkling, .clouds {
            position: fixed;
            top: 0; left: 0;

        }
        .stars {
            background: #000 url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ0cmFuc3BhcmVudCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iMzAiIHI9IjEiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSIxMjAiIGN5PSI4MCIgcj0iMS41IiBmaWxsPSIjZmZmIi8+PGNpcmNsZSBjeD0iMjAwIiBjeT0iMTUwIiByPSIxIiBmaWxsPSIjZmZmIi8+PGNpcmNsZSBjeD0iMzUwIiBjeT0iNjAiIHI9IjIiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSI0MDAiIGN5PSIyMDAiIHI9IjEiIGZpbGw9IiNmZmYiLz48Y2lyY2xlIGN4PSI4MCIgY3k9IjI1MCIgcj0iMS41IiBmaWxsPSIjZmZmIi8+PC9zdmc+') repeat;
            background-size: 500px 500px;
            animation: zoom 50s infinite linear;
        }
        .twinkling {
            background: transparent url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ0cmFuc3BhcmVudCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjIiIGZpbGw9IiNmZmZmZmYiIG9wYWNpdHk9IjAuOCIvPjxjaXJjbGUgY3g9IjI1MCIgY3k9IjEwMCIgcj0iMyIgZmlsbD0iI2ZmZmZmZiIgb3BhY2l0eT0iMC43Ii8+PGNpcmNsZSBjeD0iMTAwIiBjeT0iMjAwIiByPSIxLjUiIGZpbGw9IiNmZmZmZmYiIG9wYWNpdHk9IjAuOSIvPjxjaXJjbGUgY3g9IjMwMCIgY3k9IjI1MCIgcj0iMiIgZmlsbD0iI2ZmZmZmZiIgb3BhY2l0eT0iMC42Ii8+PC9zdmc+') repeat;
            background-size: 500px 500px;
            animation: twinkle 3s infinite;
            opacity: 0.5;
        }
        .clouds {
            background: transparent url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48ZGVmcz48cmFkaWFsR3JhZGllbnQgaWQ9ImciIGN4PSI1MCUiIGN5PSI1MCUiIHI9IjUwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI2ZmZmZmZiIgc3RvcC1vcGFjaXR5PSIwLjEiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiNmZmZmZmYiIHN0b3Atb3BhY2l0eT0iMCIvPjwvcmFkaWFsR3JhZGllbnQ+PC9kZWZzPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjEwMCIgcj0iNjAiIGZpbGw9InVybCgjZykiLz48Y2lyY2xlIGN4PSIzMDAiIGN5PSIxNTAiIHI9IjUwIiBmaWxsPSJ1cmwoI2cpIi8+PGNpcmNsZSBjeD0iMjAwIiBjeT0iMjAwIiByPSI4MCIgZmlsbD0idXJsKCNnKSIvPjwvc3ZnPg==') repeat;
            background-size: 500px 500px;
            animation: drift 50s infinite linear;
            opacity: 0.4;
        }

        /* ========== ANIMATION KEYFRAMES ========== */
        @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.5); } }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-500px); } }

        /* ========== CONTAINER ========== */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 15px 40px;
            position: relative;
            z-index: 2;
        }

        /* Header kecil - tidak mendominasi */
        .header-mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            padding: 8px 0;
        }
        .btn-back {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #93c5fd;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }
        .btn-back:hover { background: rgba(30, 41, 59, 0.9); color: #dbeafe; }
        
        .judul-kecil {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========== CARD ========== */
        .card {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(59, 130, 246, 0.1) inset;
            transition: all 0.2s;
        }
        .card h3 { color: #e0e7ff; margin-bottom: 12px; font-size: 1.1rem; }

        /* Info tambahan kecil */
        .info-kecil {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
            text-align: center;
        }
        .info-kecil b { color: #a5b4fc; }

        /* Tombol level */
        .level-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-level {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(100, 116, 139, 0.3);
            color: #cbd5e1;
            padding: 10px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .btn-level:hover { background: rgba(71, 85, 105, 0.8); border-color: #64748b; }
        .btn-level.aktif { 
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-level:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Tombol mulai */
        .btn-mulai {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            margin-top: 14px;
        }
        .btn-mulai:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); }
        .btn-mulai:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Soal */
        .badge-soal-hdr {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            padding: 6px 14px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .soal-teks {
            font-size: 1.35rem;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.5;
            margin-bottom: 18px;
            padding: 5px 2px;
            letter-spacing: 0.2px;
        }
        .opsi-list { display: flex; flex-direction: column; gap: 10px; }
        .opsi-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .opsi-btn:hover { border-color: rgba(99, 102, 241, 0.6); background: rgba(51, 65, 85, 0.5); }
        .opsi-btn .huruf {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .opsi-btn.benar {
            border-color: #34d399;
            background: rgba(52, 211, 153, 0.15);
        }
        .opsi-btn.benar .huruf { background: #34d399; border-color: #34d399; color: #064e3b; }
        .opsi-btn.salah {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.15);
        }
        .opsi-btn.salah .huruf { background: #f87171; border-color: #f87171; color: #450a0a; }
        .opsi-btn:disabled { cursor: not-allowed; }

        /* Feedback */
        .feedback {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
        }
        .feedback.benar { background: rgba(52, 211, 153, 0.1); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); display: block; }
        .feedback.salah { background: rgba(248, 113, 113, 0.1); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.3); display: block; }

        /* Tombol lanjut */
        .btn-lanjut {
            width: 100%;
            padding: 14px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            margin-top: 12px;
            display: none;
        }
        .btn-lanjut:hover { background: rgba(99, 102, 241, 0.3); }

        /* Hasil */
        .hasil-score {
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 15px 0;
        }
        .hasil-pesan { text-align: center; font-size: 1.3rem; color: #e2e8f0; margin-bottom: 20px; }
        .btn-group-result { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-action {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .btn-action:hover { background: rgba(71, 85, 105, 0.8); }
        .btn-action.primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; }
        .btn-action.primary:hover { opacity: 0.9; }

        /* Hidden */
        .hidden { display: none !important; }

        .deskripsi-mapel {
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <!-- Background bintang -->
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="clouds"></div>

    <div class="container">

        <!-- Header kecil -->
        <div class="header-mini">
            <a href="dashboard.html" class="btn-back">🏠 Dashboard</a>
            <div class="judul-kecil">🌌 IPAS • Bab 1</div>
        </div>

        <!-- LEVEL SELECTION -->
        <div class="card" id="areaLevel">
            <h3 style="text-align:center;">Pilih Level Kognitif</h3>
            <div class="info-kecil" id="info-jumlah">Muat data...</div>
            <div class="level-buttons" id="tombol-level"></div>
            <button class="btn-mulai" id="btn-mulai" disabled>🚀 Mulai</button>
        </div>

        <!-- QUIZ AREA -->
        <div class="card hidden" id="area-kuis">
            <span class="badge-soal-hdr" id="nomor-soal"></span>
            <div class="soal-teks" id="teks-soal">-</div>
            <div class="opsi-list" id="list-opsi"></div>
            <div class="feedback" id="area-feedback"></div>
            <button class="btn-lanjut" id="btn-lanjut">➡️ Soal Berikutnya</button>
        </div>

        <!-- HASIL AREA -->
        <div class="card hidden" id="area-hasil">
            <h2 style="text-align:center;color:#e0e7ff;">🏆 Hasilnya</h2>
            <div class="hasil-score" id="skor-akhir">0/0</div>
            <div class="hasil-pesan" id="pesan-hasil">-</div>
            <div style="text-align:center;color:#64748b;font-size:0.9rem;margin-bottom:15px;" id="detail-hasil"></div>
            <div class="btn-group-result">
                <button class="btn-action primary" onclick="ulangi()">🔄 Ulangi</button>
                <button class="btn-action" onclick="resetLevel()">📋 Pilih Level</button>
            </div>
        </div>
    </div>

    <!-- LOAD FILE SOAL -->
    <script src="soal-IPAS-Bab1.js"></script>

    <script>
        // ============================================
        // SETUP DATA
        // ============================================
        const bankData = window.bankSoalIPASBab1;
        const LEVELS = [
            { kode: 'C1', nama: 'Mengingat' },
            { kode: 'C2', nama: 'Memahami' },
            { kode: 'C3', nama: 'Mengaplikasi' },
            { kode: 'C4', nama: 'Menganalisis' },
            { kode: 'C5', nama: 'Mengevaluasi' }
        ];

        // State
        let activeLevel = null;
        let currentSoal = [];
        let indexSoal = 0;
        let skor = 0;
        let sudahJawab = false;

        // ============================================
        // VALIDASI & RENDER LEVEL
        // ============================================
        function renderLevel() {
            const container = document.getElementById('tombol-level');
            container.innerHTML = '';

            let totalTersedia = 0;

            LEVELS.forEach((lv, i) => {
                const jml = (bankData && bankData[lv.kode]) ? bankData[lv.kode].length : 0;
                totalTersedia += jml;

                const btn = document.createElement('button');
                btn.className = 'btn-level';
                btn.dataset.level = lv.kode;
                btn.innerHTML = `${lv.kode} • ${lv.nama} <span style="opacity:0.7;">(${jml})</span>`;

                if (jml === 0) {
                    btn.disabled = true;
                } else {
                    if (activeLevel === null) {
                        activeLevel = lv.kode;
                        btn.classList.add('aktif');
                    } else if (activeLevel === lv.kode) {
                        btn.classList.add('aktif');
                    }
                    btn.onclick = () => {
                        activeLevel = lv.kode;
                        container.querySelectorAll('.btn-level').forEach(b => b.classList.remove('aktif'));
                        btn.classList.add('aktif');
                        document.getElementById('btn-mulai').disabled = false;
                    };
                }
                container.appendChild(btn);
            });

            if (activeLevel) {
                document.getElementById('btn-mulai').disabled = false;
                const jmlLevel = (bankData[activeLevel] || []).length;
                const namaLv = LEVELS.find(l => l.kode === activeLevel).nama;
                document.getElementById('info-jumlah').innerHTML =
                    `Pilih level, lalu mulai. Level <b style="color:#a5b4fc;">${activeLevel} (${namaLv})</b> tersedia <b style="color:#a5b4fc;">${jmlLevel}</b> soal. Anda akan mengerjakan 10 soal.`;
            } else {
                document.getElementById('info-jumlah').innerHTML = 'Tidak ada soal yang tersedia.';
            }
        }

        // ============================================
        // MULAI KUIS
        // ============================================
        document.getElementById('btn-mulai').addEventListener('click', mulaiKuis);

        function mulaiKuis() {
            if (!activeLevel || !bankData || !bankData[activeLevel]) {
                alert('Pilih level terlebih dahulu!');
                return;
            }

            const semua = bankData[activeLevel];
            const acak = shuffle([...semua]);
            currentSoal = acak.slice(0, Math.min(10, acak.length));
            indexSoal = 0;
            skor = 0;
            sudahJawab = false;

            // Tampilkan kuis
            document.getElementById('area-level').style.display = 'none';
            document.getElementById('area-hasil').classList.add('hidden');
            const areaKuis = document.getElementById('area-kuis');
            areaKuis.classList.remove('hidden');

            tampilSoal();
        }

        // ============================================
        // TAMPIL SOAL
        // ============================================
        function tampilSoal() {
            const soal = currentSoal[indexSoal];
            const total = currentSoal.length;

            document.getElementById('nomor-soal').textContent = `Soal ${indexSoal + 1} / ${total} • Level ${activeLevel}`;
            document.getElementById('teks-soal').textContent = soal.soal;

            const opsiContainer = document.getElementById('list-opsi');
            opsiContainer.innerHTML = '';
            const huruf = ['A', 'B', 'C', 'D'];

            soal.pilihan.forEach((pil, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opsi-btn';
                btn.innerHTML = `<span class="huruf">${huruf[idx]}</span> ${pil}`;
                btn.onclick = () => jawab(idx, btn);
                opsiContainer.appendChild(btn);
            });

            // Reset
            document.getElementById('area-feedback').className = 'feedback';
            document.getElementById('area-feedback').textContent = '';
            document.getElementById('btn-lanjut').style.display = 'none';
            sudahJawab = false;
        }

        // ============================================
        // JAWAB
        // ============================================
        function jawab(idx, tombol) {
            if (sudahJawab) return;
            sudahJawab = true;

            const soal = currentSoal[indexSoal];
            const semua = document.querySelectorAll('.opsi-btn');
            semua.forEach(b => b.disabled = true);

            const benar = (idx === soal.kunci);
            if (benar) skor++;

            semua.forEach((b, i) => {
                if (i === soal.kunci) b.classList.add('benar');
                if (i === idx && !benar) b.classList.add('salah');
            });

            const fb = document.getElementById('area-feedback');
            if (benar) {
                fb.className = 'feedback benar';
                fb.textContent = '✅ Benar!';
            } else {
                fb.className = 'feedback salah';
                fb.textContent = `❌ Salah. Jawaban yang benar: ${soal.pilihan[soal.kunci]}`;
            }

            // Aktifkan tombol lanjut
            const btnLanjut = document.getElementById('btn-lanjut');
            btnLanjut.style.display = 'block';
            if (indexSoal === currentSoal.length - 1) {
                btnLanjut.textContent = '✅ Lihat Hasil';
            } else {
                btnLanjut.textContent = '➡️ Soal Berikutnya';
            }
        }

        // ============================================
        // LANJUT
        // ============================================
        document.getElementById('btn-lanjut').addEventListener('click', function() {
            if (indexSoal < currentSoal.length - 1) {
                indexSoal++;
                tampilSoal();
            } else {
                tampilkanHasil();
            }
        });

        // ============================================
        // TAMPIL HASIL
        // ============================================
        function tampilkanHasil() {
            document.getElementById('area-kuis').classList.add('hidden');
            document.getElementById('area-hasil').classList.remove('hidden');

            const total = currentSoal.length;
            const pct = Math.round((skor / total) * 100);

            document.getElementById('skor-akhir').textContent = `${skor}/${total}`;
            
            let pesan;
            if (pct >= 90) pesan = '🌟 Sempurna!';
            else if (pct >= 75) pesan = '💪 Bagus sekali!';
            else if (pct >= 60) pesan = '😊 Lumayan, terus berlatih!';
            else if (pct >= 40) pesan = '⚠️ Perlu belajar lagi!';
            else pesan = '📖 Ulangi materinya ya!';
            
            document.getElementById('pesan-hasil').textContent = pesan;
            document.getElementById('detail-hasil').textContent = `Benar: ${skor} • Salah: ${total - skor} • Nilai: ${pct} • Level: ${activeLevel}`;
        }

        // ============================================
        // UTIL
        // ============================================
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function ulangi() {
            if (!activeLevel || !bankData[activeLevel]) return;
            const semua = bankData[activeLevel];
            const acak = shuffle([...semua]);
            currentSoal = acak.slice(0, Math.min(10, acak.length));
            indexSoal = 0;
            skor = 0;
            sudahJawab = false;

            document.getElementById('area-hasil').classList.add('hidden');
            const areaKuis = document.getElementById('area-kuis');
            areaKuis.classList.remove('hidden');
            tampilSoal();
        }

        function resetLevel() {
            document.getElementById('area-hasil').classList.add('hidden');
            document.getElementById('area-kuis').classList.add('hidden');
            document.getElementById('area-level').classList.remove('hidden');
            activeLevel = null;
            renderLevel();
        }

        // ============================================
        // INIT
        // ============================================
        if (!bankData) {
            document.body.innerHTML = `
                <div style="text-align:center;padding:50px 20px;color:#fca5a5;font-family:sans-serif;">
