<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal IPAS</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }

        body {
            background: radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%);
            min-height:100vh; color:#e2e8f0;
        }
        .header {
            background: linear-gradient(135deg, rgba(102,126,234,0.35), rgba(118,75,162,0.35));
            color:white; padding:18px 20px; text-align:center;
            border-bottom:1px solid rgba(148,163,184,0.2);
        }
        .header h1 { font-size:22px; }
        .user-info {
            color:#c7d2fe; font-size:13px; margin-top:8px;
            background: rgba(15,23,42,0.4); display:inline-block;
            padding:6px 14px; border-radius:20px;
            border:1px solid rgba(99,102,241,0.4);
        }
        .user-info .btn-logout {
            margin-left:10px; background:#ef4444; color:#fff; border:none;
            border-radius:15px; padding:3px 12px; cursor:pointer; font-size:12px;
            text-decoration:none;
        }
        .user-info .btn-logout:hover { background:#dc2626; }

        .container { max-width:800px; margin:25px auto; padding:0 15px; }

        .card {
            background: rgba(30,41,59,0.75); backdrop-filter:blur(12px);
            border:1px solid rgba(148,163,184,0.22); border-radius:18px;
            padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.45); margin-bottom:20px;
        }
        .level-select { text-align:center; margin-bottom:20px; }
        .level-select h2 { color:#e0e7ff; margin-bottom:15px; font-size:22px; }

        .level-btn {
            display:inline-block; padding:12px 22px; margin:5px;
            background: rgba(51,65,85,0.5); color:#c7d2fe;
            border:2px solid rgba(129,140,248,0.5); border-radius:25px;
            font-weight:bold; cursor:pointer; transition:all 0.3s ease; font-size:15px;
        }
        .level-btn:hover { background:#6366f1; color:#fff; border-color:#6366f1; }
        .level-btn.active {
            background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
            border-color:#6366f1; box-shadow:0 4px 15px rgba(99,102,241,0.4);
        }
        .level-btn.terkunci {
            background: rgba(30,41,59,0.4); color:#64748b;
            border-color:#475569; cursor:not-allowed; opacity:0.55;
        }
        .level-btn.terkunci:hover { background:rgba(30,41,59,0.4); color:#64748b; border-color:#475569; }
        .level-btn.lulus {
            background: rgba(34,197,94,0.15); color:#86efac; border-color:#22c55e;
        }
        /* Gaya khusus level "COMING SOON" (terkunci sementara C3-C5) */
        .level-btn.segera {
            background: rgba(251,191,36,0.1); color:#fcd34d;
            border-color:#f59e0b; border-style: dashed; cursor:not-allowed;
        }
        .level-btn.segera:hover { background:rgba(251,191,36,0.1); color:#fcd34d; }

        .info-bank {
            background: rgba(15,23,42,0.4); border-left:4px solid #8b5cf6;
            padding:10px 15px; border-radius:8px; margin-bottom:20px;
            color:#cbd5e1; font-size:14px;
        }
        .btn-mulai {
            display:block; width:100%;
            background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
            padding:15px; border:none; border-radius:12px; font-size:18px;
            font-weight:bold; cursor:pointer; transition:all 0.3s; margin-top:15px;
        }
        .btn-mulai:hover { transform:translateY(-2px); }
        .btn-mulai:disabled { background:#334155; cursor:not-allowed; transform:none; opacity:0.5; }

        .question-area { display:none; }
        .question-area.show { display:block; }
        .top-bar {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:20px; flex-wrap:wrap; gap:10px;
        }
        .progress { background:#1e293b; border-radius:20px; height:12px;
            flex-grow:1; margin:0 15px; min-width:120px; overflow:hidden; }
        .progress-bar { height:100%; background:linear-gradient(90deg,#6366f1,#8b5cf6);
            border-radius:20px; transition:width 0.5s ease; width:10%; }
        .score-display, .timer-display {
            background:rgba(51,65,85,0.6); padding:8px 15px; border-radius:20px;
            font-weight:bold; color:#c7d2fe; font-size:14px;
            border:1px solid rgba(129,140,248,0.3);
        }
        .question-card { margin:20px 0; }
        .question-card .q-number {
            display:inline-block; background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff; padding:6px 16px; border-radius:20px; font-size:15px;
            margin-bottom:12px; font-weight:700;
        }
        .question-card h3 { color:#f1f5f9; font-size:24px; line-height:1.6;
            margin-bottom:22px; font-weight:600; }
        .option-btn {
            display:block; width:100%; text-align:left; padding:15px 20px;
            border:2px solid #3b4a63; border-radius:12px; background:rgba(15,23,42,0.4);
            color:#e2e8f0; margin-bottom:10px; cursor:pointer; font-size:17px;
            line-height:1.5; transition:all 0.2s ease;
        }
        .option-btn:hover { border-color:#818cf8; background:rgba(51,65,85,0.6); }
        .option-btn.correct { border-color:#22c55e; background:rgba(34,197,94,0.15); color:#bbf7d0; }
        .option-btn.wrong { border-color:#ef4444; background:rgba(239,68,68,0.15); color:#fecaca; }
        .option-btn:disabled { cursor:not-allowed; }
        .option-letter { font-weight:bold; color:#a5b4fc; margin-right:10px; }

        .result-area { display:none; text-align:center; padding:25px 0; }
        .result-area.show { display:block; }
        .result-area h2 { color:#e0e7ff; }
        .result-score { font-size:48px; font-weight:bold; margin:12px 0; color:#a78bfa; }
        .result-msg { font-size:19px; color:#e2e8f0; margin-bottom:8px; white-space:pre-line; }
        .result-level { font-size:15px; color:#fff; padding:8px 20px; display:inline-block;
            border-radius:20px; margin-top:8px; font-weight:bold; }

        .review-list { text-align:left; margin-top:22px; }
        .review-list h3 { color:#e0e7ff; }
        .review-item { background:rgba(15,23,42,0.5); border:1px solid #334155;
            border-radius:10px; padding:15px; margin-bottom:15px; }
        .review-item .r-question { font-weight:bold; color:#f1f5f9; margin-bottom:10px; font-size:16px; }
        .review-item .r-answer { font-size:15px; margin:5px 0; color:#cbd5e1; }
        .kunci { background:rgba(34,197,94,0.1); border-left:4px solid #22c55e;
            padding:10px 15px; border-radius:8px; font-size:14px; margin-top:5px; color:#bbf7d0; }

        .btn-kembali {
            background:rgba(51,65,85,0.5); color:#c7d2fe; padding:11px 24px;
            border:2px solid #4f46e5; border-radius:25px; text-decoration:none;
            font-weight:bold; margin-top:18px; display:inline-block; transition:all 0.3s;
        }
        .btn-kembali:hover { background:#6366f1; color:#fff; }
        .btn-selesai {
            background:#22c55e; color:#fff; padding:12px 25px; border:none;
            border-radius:25px; font-weight:bold; font-size:16px; cursor:pointer;
            margin-top:10px; transition:all 0.3s;
        }
        .btn-selesai:hover { background:#16a34a; }
        .footer { text-align:center; padding:20px; color:#64748b; font-size:12px; }

        .notif-open {
            position:fixed; top:20px; left:50%; transform:translateX(-50%);
            background:#065f46; color:#d1fae5; padding:14px 22px; border-radius:12px;
            border:1px solid #34d399; box-shadow:0 10px 30px rgba(0,0,0,0.3);
            z-index:999; font-weight:bold; font-size:15px; max-width:90%;
            text-align:center; opacity:0; pointer-events:none; transition:opacity 0.3s;
        }
        .notif-open.show { opacity:1; }

        @media (max-width:600px) {
            .container { margin:12px auto; }
            .level-btn { padding:9px 14px; font-size:13px; }
            .question-card h3 { font-size:20px; }
            .option-btn { font-size:15px; }
        }
    </style>
</head>
<body>

    <div class="notif-open" id="notifOpen"></div>

    <div class="header">
        <h1 id="judulMapel">✏️ Latihan Soal</h1>
        <p id="subJudul">...</p>
        <div class="user-info" id="userInfo"></div>
    </div>

    <div class="container">

        <!-- Pilihan Level -->
        <div class="card" id="levelSelectCard">
            <div class="level-select">
                <h2>📊 Pilih Level Soal</h2>
                <div id="levelButtons"></div>
            </div>
            <div id="infoTersedia" class="info-bank">
                📚 Silakan pilih level untuk melihat jumlah soal yang tersedia.
            </div>
            <button class="btn-mulai" id="btnMulai" disabled>
                ▶️ Mulai Latihan (10 Soal)
            </button>
        </div>

        <!-- Area Kuis -->
        <div class="card question-area" id="questionArea">
            <div class="top-bar">
                <div class="score-display">⭐ Skor: <span id="skorLive">0</span></div>
                <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
                <div class="timer-display">⏱️ <span id="timer">00:00</span></div>
            </div>
            <div id="questionContainer"></div>
            <button class="btn-mulai" id="btnSelesai">✅ Selesai & Lihat Hasil</button>
        </div>

        <!-- Area Hasil -->
        <div class="card result-area" id="resultArea">
            <h2>🏆 Hasil Latihan</h2>
            <div class="result-score" id="scoreAkhir">0/10</div>
            <div class="result-msg" id="resultMsg"></div>
            <div id="levelBadge" class="result-level"></div>
            <div class="review-list" id="reviewList"></div>
            <a href="dashboard.html" class="btn-kembali" onclick="ulangiLatihan()">← Kembali ke Level</a><br>
            <button class="btn-selesai" onclick="ulangiLatihan()">🔄 Ulangi Latihan</button>
        </div>

        <div class="footer" id="footerInfo">📖 Bank Soal IPAS Kelas 3</div>
    </div>

    <script src="soal-IPAS-Bab1.js"></script>
    <script src="soal-IPAS-Bab2.js"></script>

    <script>
    /* =========================================================
       LOGIKA DINAMIS latihan.html (Update: akses developer)
       - Hanya IPAS Bab 1 & Bab 2 didukung
       - Developer/Admin => bebas semua level & Bab 2 (untuk testing)
       - Siswa biasa:
           * C1 terbuka sejak awal
           * C2 terbuka bila C1 lulus (nilai >= 70)
           * C3, C4, C5 sengaja DIKUNCI SEMENTARA (COMING SOON)
             sampai update bank soal berikutnya. (Developer bebas.)
       ========================================================= */

    // ---------- 1. Parameter URL ----------
    function ambilParam(nama) {
        var p = new URLSearchParams(window.location.search);
        return p.get(nama);
    }
    var PARAM_MAPEL = (ambilParam('mapel') || 'IPAS').trim();
    var PARAM_BAB   = parseInt(ambilParam('bab'), 10) || 1;

    // ---------- 2. Login ----------
    var currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('user')); } catch(e){ currentUser = null; }

    if (!currentUser || !currentUser.id) {
        alert('Anda harus masuk terlebih dahulu!');
        window.location.href = 'auth.html';
    }
    var userId = (currentUser && currentUser.id) ? currentUser.id : 'guest';
    var namaUser = (currentUser && currentUser.nama) ? currentUser.nama : '';

    // 🔑 TAMBAHAN: deteksi developer / admin
    var isDev = currentUser && (currentUser.developer === true || currentUser.isAdmin === true);

    document.getElementById('userInfo').innerHTML =
        '👤 <b>' + namaUser + '</b>' +
        (isDev ? ' <span style="color:#a78bfa;font-size:11px;">(Admin)</span>' : '') +
        ' <a href="#" class="btn-logout" onclick="keluar(event)">Keluar</a>';

    // ---------- 3. Konfigurasi (mapel & bab yang didukung) ----------
    var KONFIG_BAB = null;

    if (PARAM_MAPEL === 'IPAS' && PARAM_BAB === 1) {
        KONFIG_BAB = {
            babLabel     : 'Bab 1: Keajaiban Tubuhku',
            namaGlobal   : 'bankSoalIPASBab1',
            progressKey  : 'levelLulus_IPAS_' + userId,
            syaratBab2Key: null
        };
    } else if (PARAM_MAPEL === 'IPAS' && PARAM_BAB === 2) {
        KONFIG_BAB = {
            babLabel     : 'Bab 2: Dahulu, Kini, dan Nanti',
            namaGlobal   : 'bankSoalIPASBab2',
            progressKey  : 'levelLulus_IPAS_bab2_' + userId,
            syaratBab2Key: { key: 'levelLulus_IPAS_' + userId, level: 'C3' }
        };
    }

    // ---------- 4. Update judul & footer ----------
    var judulMapel = document.getElementById('judulMapel');
    var subJudul   = document.getElementById('subJudul');
    var footerInfo = document.getElementById('footerInfo');

    function fungsikanHalaman() {
        if (KONFIG_BAB) {
            judulMapel.textContent = '✏️ Latihan Soal IPAS';
            var judulBab = (PARAM_BAB === 1) ? 'Keajaiban Tubuhku'
                          : (PARAM_BAB === 2) ? 'Dahulu, Kini, dan Nanti'
                          : 'Bab ' + PARAM_BAB;
            subJudul.textContent = (PARAM_BAB === 1 || PARAM_BAB === 2)
                ? 'Bab ' + PARAM_BAB + ': ' + judulBab + ' - Kelas 3'
                : 'Bab ' + PARAM_BAB + ' - Kelas 3';
            document.title = 'Latihan IPAS Bab ' + PARAM_BAB;
            footerInfo.textContent = '📖 Bank Soal IPAS Kelas 3 • Bab ' + judulBab;
        } else {
            document.getElementById('levelSelectCard').innerHTML =
                '<div style="text-align:center;"><h2 style="color:#fca5a5;">🚧 Belum Tersedia</h2>' +
                '<p style="color:#e2e8f0;line-height:1.6;margin-top:10px;">Mapel <b>' + PARAM_MAPEL +
                '</b> (Bab ' + PARAM_BAB + ') belum didukung latihan ini.<br>' +
                'Saat ini hanya tersedia <b>IPAS Bab 1 &amp; Bab 2</b>.</p><br>' +
                '<a href="dashboard.html" class="btn-kembali">← Kembali ke Dashboard</a></div>';
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';
            return false;
        }
        return true;
    }
    if (!fungsikanHalaman()) throw new Error('unsupported');
    if (!KONFIG_BAB) throw new Error('unsupported2');

    // ---------- 5. Cek syarat unlock bab 2 (dev otomatis lolos) ----------
    function syaratBab2Lulus() {
        if (!KONFIG_BAB.syaratBab2Key) return true;
        try {
            var st = JSON.parse(localStorage.getItem(KONFIG_BAB.syaratBab2Key.key)) || {};
            return st[KONFIG_BAB.syaratBab2Key.level] === true;
        } catch(e){ return false; }
    }
    // 🔑 Developer/Admin bebas test Bab 2 tanpa menyelesaikan syarat
    if (false && KONFIG_BAB.syaratBab2Key && !isDev && !syaratBab2Lulus()) {
        document.getElementById('levelSelectCard').innerHTML =
            '<div style="text-align:center;">' +
            '<h2 style="color:#fca5a5;">🔒 Bab 2 Terkunci</h2>' +
            '<p style="color:#e2e8f0;line-height:1.6;margin-top:10px;">' +
            'Untuk membuka <b>Bab 2: Dahulu, Kini, dan Nanti</b>, ' +
            'kamu harus menyelesaikan <b>Bab 1 IPAS level C3</b> terlebih dahulu.</p><br>' +
            '<a href="dashboard.html" class="btn-kembali">← Kembali ke Dashboard</a></div>';
        document.getElementById('questionArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'none';
        throw new Error('locked');
    }

    // ============ AMBIL BANK SOAL ============
    var bankLevel = null;
    if (KONFIG_BAB.namaGlobal === 'bankSoalIPASBab1') bankLevel = (typeof bankSoalIPASBab1 !== 'undefined') ? bankSoalIPASBab1 : null;
    if (KONFIG_BAB.namaGlobal === 'bankSoalIPASBab2') bankLevel = (typeof bankSoalIPASBab2 !== 'undefined') ? bankSoalIPASBab2 : null;

    var PETA_LEVEL = ['C1','C2','C3','C4','C5'];
    var totalAda = 0;
    if (bankLevel) {
        PETA_LEVEL.forEach(function(lv){ totalAda += (bankLevel[lv] || []).length; });
    }
    if (!bankLevel || totalAda === 0) {
        var fileTujuan = 'soal-IPAS-Bab' + PARAM_BAB + '.js';
        document.getElementById('levelSelectCard').innerHTML =
            '<div style="text-align:center;"><h2 style="color:#fbbf24;">⚠️ Bank Soal Belum Ada</h2>' +
            '<p style="color:#e2e8f0;margin-top:10px;">File <b>' + fileTujuan + '</b> belum ditemukan, atau belum berisi <b>' +
            KONFIG_BAB.namaGlobal + '</b>.</p><br>' +
            '<a href="dashboard.html" class="btn-kembali">← Kembali ke Dashboard</a></div>';
        document.getElementById('questionArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'none';
        throw new Error('no-bank');
    }

    // ============ KUNCI PER-USER ============
    var PROGRES_KEY = KONFIG_BAB.progressKey;
    var urutanLevel = ['C1','C2','C3','C4','C5'];
    var NILAI_MIN_LULUS = 70;
    var labelLevel = { C1:'Mengingat', C2:'Memahami', C3:'Mengaplikasi',
                       C4:'Menganalisis', C5:'Mengevaluasi' };

    function bacaStatusLulus() {
        try { return JSON.parse(localStorage.getItem(PROGRES_KEY)) || {}; }
        catch(e) { return {}; }
    }
    function simpanStatusLulus(level) {
        var st = bacaStatusLulus();
        st[level] = true;
        localStorage.setItem(PROGRES_KEY, JSON.stringify(st));
    }
    function sudahLulus(level) { return bacaStatusLulus()[level] === true; }

    // ============================================================
    // KUNCI AKSES LEVEL (versi update):
    //  - Developer: semua level bebas.
    //  - Siswa:
    //       * C1 selalu terbuka.
    //       * C2 terbuka bila C1 lulus.
    //       * C3/C4/C5 DIKUNCI SEMENTARA (coming soon), untuk siswa.
    // ============================================================
    var LEVEL_TERSEDIA_SISWA = 2;   // saat ini hanya C1 & C2 untuk siswa

    function bisaDibuka(level) {
        if (isDev) return true;                        // dev bebas semua
        var idx = urutanLevel.indexOf(level);

        // Level yang "belum rilis" untuk siswa dikunci otomatis
        if (idx >= LEVEL_TERSEDIA_SISWA) return false; // C3-C5 dikunci sementara

        if (idx <= 0) return true;                     // C1 bebas
        return sudahLulus(urutanLevel[idx-1]);         // C2 perlu C1
    }

    // Apakah level ini "dikunci karena belum rilis" (coming soon)?
    function levelComingSoon(level) {
        if (isDev) return false;
        var idx = urutanLevel.indexOf(level);
        return idx >= LEVEL_TERSEDIA_SISWA;
    }

    // ---------- 6. Logout ----------
    function keluar(e) {
        if (e) e.preventDefault();
        localStorage.removeItem('user');
        window.location.href = 'auth.html';
    }
    window.keluar = keluar;

    // ---------- 7. Shuffle ----------
    function shuffle(array) {
        var arr = array.slice();
        for (var i=arr.length-1;i>0;i--) {
            var j=Math.floor(Math.random()*(i+1));
            var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
        }
        return arr;
    }
    function formatWaktu(d) {
        var m = Math.floor(d/60), s = d % 60;
        return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    }

    // ============ RENDER TOMBOL LEVEL ============
    function renderLevelButtons() {
        var box = document.getElementById('levelButtons');
        box.innerHTML = '';
        urutanLevel.forEach(function(level){
            var jml = (bankLevel[level] || []).length;
            var buka  = bisaDibuka(level);
            var lulus = sudahLulus(level);
            var cs    = levelComingSoon(level);   // kosong/coming soon

            var ikon='', kelas='';
            if (lulus) {
                ikon=' ✅'; kelas=' lulus';
            } else if (cs) {
                ikon=' 🔒'; kelas=' segera';       // coming soon - kuning putus-putus
            } else if (buka) {
                ikon=' ▶️';
            } else {
                ikon=' 🔒'; kelas=' terkunci';
            }

            var labelKonten = level + ' - ' + labelLevel[level] + ' (' + jml + ')' + ikon;
            var b = document.createElement('button');
            b.className = 'level-btn' + kelas;
            b.textContent = labelKonten;

            if (cs) {
                // Diklik => info "segera hadir", bukan coba kerjakan level kosong
                b.onclick = (function(lv){
                    return function(){
                        alert('🚧 Level ' + lv + ' (' + labelLevel[lv] + ') akan segera dibuka pada update berikutnya. Sabar ya 😊');
                    };
                })(level);
            }
            else if (buka) {
                b.onclick = (function(lv, btn){ return function(){ pilihLevel(lv, btn); }; })(level, b);
            }
            else {
                // Masih terkunci karena aturan lulus (mis. siswa klik C2 sebelum C1 lulus)
                b.onclick = (function(lv){
                    return function(){
                        var prev = urutanLevel[urutanLevel.indexOf(lv)-1];
                        alert('🔒 Level ' + lv + ' masih terkunci!\nLuluskan Level ' + prev + ' (nilai ≥ ' + NILAI_MIN_LULUS + ') dulu.');
                    };
                })(level);
            }
            box.appendChild(b);
        });
    }

    // ============ PILIH LEVEL ============
    function pilihLevel(level, btn) {
        if (!bisaDibuka(level)) return;
        currentLevel = level;
        document.querySelectorAll('.level-btn').forEach(function(x){ x.classList.remove('active'); });
        btn.classList.add('active');
        var total = (bankLevel[level] || []).length;
        document.getElementById('infoTersedia').innerHTML =
            '📚 Level <b>' + level + ' (' + labelLevel[level] + ')</b>: tersedia <b>' + total + ' soal</b>. ' +
            'Selesaikan 10 soal, raih nilai ≥ ' + NILAI_MIN_LULUS + ' untuk buka level berikutnya.';
        document.getElementById('btnMulai').disabled = false;
    }

    // ============ MULAI LATIHAN ============
    function mulaiLatihan() {
        if (!currentLevel) { alert('Pilih level dulu!'); return; }
        var bankLv = (bankLevel[currentLevel] || []);
        if (bankLv.length === 0) { alert('Bank soal di level ini kosong.'); return; }
        soalLatihan = shuffle(bankLv).slice(0,10);
        nomorSaatIni = 0; jawabanUser = []; skor = 0; detikBerjalan = 0;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function(){
            detikBerjalan++;
            document.getElementById('timer').textContent = formatWaktu(detikBerjalan);
        }, 1000);

        document.getElementById('levelSelectCard').style.display = 'none';
        document.getElementById('questionArea').classList.add('show');
        document.getElementById('resultArea').classList.remove('show');
        tampilkanSoal();
    }

    // ============ TAMPILKAN SOAL ============
    function tampilkanSoal() {
        var soal = soalLatihan[nomorSaatIni];
        var box = document.getElementById('questionContainer');
        var total = soalLatihan.length;
        document.getElementById('progressBar').style.width = ((nomorSaatIni/total)*100) + '%';
        document.getElementById('skorLive').textContent = skor;
        var huruf = ['A','B','C','D','E'];
        var h = '<div class="question-card">' +
                '<span class="q-number">Soal ' + (nomorSaatIni+1) + ' / ' + total + '</span>' +
                '<h3>' + soal.soal + '</h3><div id="optionsList">';
        soal.pilihan.forEach(function(pil, idx){
            h += '<button class="option-btn" onclick="pilihJawaban(' + idx + ')">' +
                 '<span class="option-letter">' + huruf[idx] + '.</span> ' + pil + '</button>';
        });
        h += '</div></div>';
        box.innerHTML = h;
        document.getElementById('btnSelesai').innerHTML = '✅ Selesai & Lihat Hasil';
        document.getElementById('btnSelesai').onclick = function(){ selesaiLatihan(); };
    }

    // ============ PILIH JAWABAN ============
    window.pilihJawaban = function(idx) {
        var soal = soalLatihan[nomorSaatIni];
        var semuaBtn = document.querySelectorAll('.option-btn');
        var benar = (idx === soal.kunci);
        if (benar) skor++;
        jawabanUser.push({ soal: soal.soal, pilihan: soal.pilihan, pilihanUser: idx,
                           kunci: soal.kunci, benar: benar });
        semuaBtn.forEach(function(btn, i){
            btn.disabled = true;
            if (i === soal.kunci) btn.classList.add('correct');
            if (i === idx && idx !== soal.kunci) btn.classList.add('wrong');
        });
        document.getElementById('skorLive').textContent = skor;
        var bs = document.getElementById('btnSelesai');
        if (nomorSaatIni < soalLatihan.length - 1) {
            bs.innerHTML = '➡️ Soal Berikutnya';
            bs.onclick = function(){ nomorSaatIni++; tampilkanSoal(); };
        } else {
            bs.innerHTML = '✅ Selesai & Lihat Hasil';
            bs.onclick = function(){ selesaiLatihan(); };
        }
    };

    // ============ SELESAI LATIHAN ============
    function selesaiLatihan() {
        clearInterval(timerInterval);
        if (jawabanUser.length < soalLatihan.length) {
            for (var i=jawabanUser.length; i<soalLatihan.length; i++) {
                var s = soalLatihan[i];
                jawabanUser.push({ soal: s.soal, pilihan: s.pilihan, pilihanUser: -1,
                                   kunci: s.kunci, benar: false });
            }
        }
        document.getElementById('questionArea').classList.remove('show');
        document.getElementById('resultArea').classList.add('show');

        var benarJml = jawabanUser.filter(function(j){ return j.benar; }).length;
        var total = soalLatihan.length;
        document.getElementById('scoreAkhir').textContent = benarJml + '/' + total;
        var pct = (benarJml / total) * 100;
        var lulusLevelIni = (pct >= NILAI_MIN_LULUS);

        var msg, badgeText, badgeColor;
        if (pct>=90){ msg='🌟 Luar biasa! Kamu sangat paham!'; badgeText='🏅 SANGAT BAIK'; badgeColor='#f59e0b'; }
        else if (pct>=75){ msg='👍 Bagus sekali!'; badgeText='🎖️ BAGUS'; badgeColor='#22c55e'; }
        else if (pct>=60){ msg='😊 Cukup baik.'; badgeText='📈 CUKUP'; badgeColor='#3b82f6'; }
        else if (pct>=40){ msg='💪 Ayo coba lagi!'; badgeText='📚 PERLU BELAJAR'; badgeColor='#f97316'; }
        else { msg='📖 Baca lagi materinya ya!'; badgeText='💡 MULAI ULANG'; badgeColor='#ef4444'; }

        // Simpan kelulusan & cek level berikutnya untuk pesan
        var adaLevelBerikut = false;
        var levelBerikutnya = null;
        if (lulusLevelIni) {
            simpanStatusLulus(currentLevel);
            var ci = urutanLevel.indexOf(currentLevel);
            // Ada level berikut yang bisa dibuka siswa?
            if (!isDev) {
                // jumlah level yang tersedia untuk siswa (C1..C2 = 2)
                if (ci >= 0 && ci+1 < LEVEL_TERSEDIA_SISWA) {
                    adaLevelBerikut = true;
                    levelBerikutnya = urutanLevel[ci+1];
                }
                // kalau ci+1 == LEVEL_TERSEDIA_SISWA => level berikut "coming soon" utk siswa
            } else {
                // Developer: xxxx level berikut selalu terbuka
                if (ci+1 < urutanLevel.length) {
                    adaLevelBerikut = true;
                    levelBerikutnya = urutanLevel[ci+1];
                }
            }
        }

        if (lulusLevelIni) {
            if (adaLevelBerikut) {
                msg += '\n✅ Lulus! Level ' + levelBerikutnya + ' (' + labelLevel[levelBerikutnya] + ') terbuka.';
                tampilkanNotifikasi('🎉 Level ' + currentLevel + ' lulus!\nLevel ' + levelBerikutnya + ' (' + labelLevel[levelBerikutnya] + ') terbuka!');
            } else if (!isDev) {
                // Siswa lulus level terakhir yang tersedia (mis. C2)
                msg += '\n🏅 Kamu menyelesaikan semua level yang tersedia saat ini!\n🚧 Level lanjutan akan segera hadir. Terus berlatih ya!';
                tampilkanNotifikasi('🎉 Level ' + currentLevel + ' lulus!\n✅ Semua level tersedia selesai. Level lain segera hadir!');
            } else {
                // Dev lulus level terakhir
                if (currentLevel === 'C5') {
                    msg += '\n🏁 Hebat! Kamu menuntaskan level tertinggi.';
                    tampilkanNotifikasi('🎉 Semua level selesai! Anda adalah seorang ahli! 🏆');
                }
            }
        } else {
            // gagal - belum bisa disimpan (tinggal tampilkan saja)
        }

        document.getElementById('resultMsg').textContent = msg;
        var badge = document.getElementById('levelBadge');
        badge.textContent = badgeText + ' • Level ' + currentLevel;
        badge.style.background = badgeColor;

        tampilkanReview();
        renderLevelButtons();
    }

    // ============ REVIEW ============
    function tampilkanReview() {
        var list = document.getElementById('reviewList');
        var huruf = ['A','B','C','D','E'];
        var h = '<h3 style="margin:15px 0;">📋 Pembahasan:</h3>';
        jawabanUser.forEach(function(j, i){
            h += '<div class="review-item"><div class="r-question">' + (i+1) + '. ' + j.soal + '</div>';
            j.pilihan.forEach(function(pil, idx){
                var st = '';
                if (idx === j.kunci) st = 'border-left:4px solid #22c55e; padding-left:8px;';
                if (idx === j.pilihanUser && !j.benar) st = 'border-left:4px solid #ef4444; padding-left:8px;';
                var mark = (idx === j.kunci) ? ' ✔' : ((idx === j.pilihanUser && !j.benar) ? ' ✘' : '');
                h += '<div class="r-answer" style="' + st + '">' + huruf[idx] + '. ' + pil + mark + '</div>';
            });
            if (!j.benar) h += '<div class="kunci">💡 Jawaban benar: <b>' + huruf[j.kunci] + '. ' + j.pilihan[j.kunci] + '</b></div>';
            h += '</div>';
        });
        list.innerHTML = h;
    }

    // ============ ULANGI / KEMBALI ============
    function ulangiLatihan() {
        document.getElementById('resultArea').classList.remove('show');
        document.getElementById('levelSelectCard').style.display = 'block';
        resetQ();
        renderLevelButtons();
    }
    function resetQ() {
        nomorSaatIni = 0; jawabanUser = []; skor = 0; detikBerjalan = 0;
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('timer').textContent = '00:00';
        document.getElementById('skorLive').textContent = '0';
        document.getElementById('btnMulai').disabled = true;
        document.querySelectorAll('.level-btn').forEach(function(b){ b.classList.remove('active'); });
        currentLevel = null;
        document.getElementById('infoTersedia').innerHTML = '📚 Silakan pilih level.';
        document.getElementById('questionArea').classList.remove('show');
    }

    // ============ NOTIFIKASI ============
    function tampilkanNotifikasi(pesan) {
        var el = document.getElementById('notifOpen');
        el.textContent = pesan;
        el.classList.add('show');
        setTimeout(function(){ el.classList.remove('show'); }, 4500);
    }

    // ============ EKSPOSE & INISIALISASI ============
    window.renderLevelButtons = renderLevelButtons;
    window.mulaiLatihan = mulaiLatihan;
    window.ulangiLatihan = ulangiLatihan;

    document.getElementById('btnMulai').addEventListener('click', function(){
        if (currentLevel) mulaiLatihan();
        else alert('Pilih level dulu!');
    });

    renderLevelButtons();
    </script>
</body>
</html>
