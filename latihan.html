<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal IPAS - Bab 1: Keajaiban Tubuhku</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body { background:#f0f4ff; min-height:100vh; }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; padding: 25px 20px; text-align:center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .header h1 { font-size:24px; margin-bottom:5px; }
        .header p { font-size:14px; opacity:0.9; }
        
        .container { max-width:800px; margin:30px auto; padding:0 15px; }
        
        .card {
            background: white; border-radius:16px; padding:25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); margin-bottom:20px;
        }
        
        .level-select { text-align:center; margin-bottom:20px; }
        .level-select h2 { color:#333; margin-bottom:15px; font-size:20px; }
        
        .level-btn {
            display:inline-block; padding:12px 25px; margin:5px;
            background:#eef2ff; color:#667eea; border:2px solid #667eea;
            border-radius:25px; font-weight:bold; cursor:pointer;
            transition: all 0.3s ease;
        }
        .level-btn:hover { background:#667eea; color:white; }
        .level-btn.active { background:#667eea; color:white; box-shadow:0 4px 12px rgba(102,126,234,0.4); }
        
        .info-bank {
            background:#f8faff; border-left:4px solid #764ba2;
            padding:10px 15px; border-radius:8px; margin-bottom:20px;
            color:#555; font-size:14px;
        }
        
        .btn-mulai {
            display:block; width:100%; background:#764ba2; color:white;
            padding:15px; border:none; border-radius:12px; font-size:18px;
            font-weight:bold; cursor:pointer; transition:all 0.3s;
            margin-top:15px;
        }
        .btn-mulai:hover { background:#5e3a85; transform:translateY(-2px); }
        .btn-mulai:disabled { background:#ccc; cursor:not-allowed; transform:none; }
        
        .question-area { display:none; }
        .question-area.show { display:block; }
        
        .top-bar {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:20px; flex-wrap:wrap; gap:10px;
        }
        .progress {
            background:#e0e0e0; border-radius:20px; height:12px;
            flex-grow:1; margin:0 15px; min-width:120px; overflow:hidden;
        }
        .progress-bar {
            height:100%; background:linear-gradient(90deg,#667eea,#764ba2);
            border-radius:20px; transition:width 0.5s ease; width:10%;
        }
        .score-display, .timer-display {
            background:#eef2ff; padding:8px 15px; border-radius:20px;
            font-weight:bold; color:#667eea; font-size:14px;
        }
        
        .question-card { margin:20px 0; }
        .question-card .q-number {
            display:inline-block; background:#764ba2; color:white;
            padding:5px 15px; border-radius:20px; font-size:14px; margin-bottom:10px;
        }
        .question-card h3 { color:#333; font-size:18px; line-height:1.5; margin-bottom:20px; }
        
        .option-btn {
            display:block; width:100%; text-align:left; padding:15px 20px;
            border:2px solid #ddd; border-radius:12px; background:#fafaff;
            margin-bottom:10px; cursor:pointer; font-size:15px; line-height:1.4;
            transition: all 0.2s ease;
        }
        .option-btn:hover { border-color:#667eea; background:#f0f2ff; }
        .option-btn.selected { border-color:#764ba2; background:#e8e0ff; }
        .option-btn.correct { border-color:#22c55e; background:#e8ffe8; }
        .option-btn.wrong { border-color:#ef4444; background:#ffe8e8; }
        .option-letter { font-weight:bold; color:#764ba2; margin-right:10px; }
        
        .result-area { display:none; text-align:center; padding:30px 0; }
        .result-area.show { display:block; }
        .result-score { font-size:50px; font-weight:bold; color:#764ba2; margin:15px 0; }
        .result-msg { font-size:20px; color:#333; margin-bottom:10px; }
        .result-level { font-size:16px; color:#fff; padding:8px 20px; display:inline-block; border-radius:20px; margin-top:10px; }
        
        .review-list { text-align:left; margin-top:25px; }
        .review-item {
            background:#fafaff; border:1px solid #e0e0e0; border-radius:10px;
            padding:15px; margin-bottom:15px;
        }
        .review-item .r-question { font-weight:bold; color:#333; margin-bottom:10px; }
        .review-item .r-answer { font-size:14px; margin:5px 0; }
        .r-correct { color:#22c55e; font-weight:bold; }
        .r-wrong { color:#ef4444; font-weight:bold; }
        .kunci {
            background:#eef9f0; border-left:4px solid #22c55e;
            padding:10px 15px; border-radius:8px; font-size:14px; margin-top:5px;
        }
        
        .btn-kembali {
            display:inline-block; background:#f0f4ff; color:#667eea;
            padding:10px 25px; border:2px solid #667eea; border-radius:25px;
            text-decoration:none; font-weight:bold; margin-top:20px;
            transition:all 0.3s;
        }
        .btn-kembali:hover { background:#667eea; color:white; }
        
        .btn-selesai {
            background:#22c55e; color:white; padding:12px 25px;
            border:none; border-radius:25px; font-weight:bold; font-size:16px;
            cursor:pointer; margin-top:10px; transition:all 0.3s;
        }
        .btn-selesai:hover { background:#16a34a; }
        
        .footer { text-align:center; padding:20px; color:#999; font-size:12px; }
        
        @media (max-width: 600px) {
            .container { margin:15px auto; }
            .header h1 { font-size:20px; }
            .level-btn { padding:10px 18px; font-size:14px; }
            .question-card h3 { font-size:16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✏️ Latihan Soal IPAS</h1>
        <p>Bab 1: Keajaiban Tubuhku - Kelas 3</p>
    </div>
    
    <div class="container">
        <!-- Pilihan Level -->
        <div class="card" id="levelSelectCard">
            <div class="level-select">
                <h2>📊 Pilih Level Soal</h2>
                
                <button class="level-btn" data-level="C1" onclick="pilihLevel('C1', this)">C1 - Mengingat</button>
                <button class="level-btn" data-level="C2" onclick="pilihLevel('C2', this)">C2 - Memahami</button>
                <button class="level-btn" data-level="C3" onclick="pilihLevel('C3', this)">C3 - Mengaplikasi</button>
                <button class="level-btn" data-level="C4" onclick="pilihLevel('C4', this)">C4 - Menganalisis</button>
                <button class="level-btn" data-level="C5" onclick="pilihLevel('C5', this)">C5 - Mengevaluasi</button>
            </div>
            
            <div id="infoTersedia" class="info-bank">
                📚 Silakan pilih level untuk melihat jumlah soal yang tersedia.
            </div>
            
            <button class="btn-mulai" id="btnMulai" disabled onclick="mulaiLatihan()">
                ▶️ Mulai Latihan (10 Soal)
            </button>
        </div>
        
        <!-- Area Kuis -->
        <div class="card question-area" id="questionArea">
            <div class="top-bar">
                <div class="score-display">⭐ Skor: <span id="skorLive">0</span></div>
                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="timer-display">⏱️ <span id="timer">00:00</span></div>
            </div>
            
            <div id="questionContainer"></div>
            
            <button class="btn-mulai" id="btnSelesai" onclick="selesaiLatihan()">
                ✅ Selesai & Lihat Hasil
            </button>
        </div>
        
        <!-- Area Hasil -->
        <div class="card result-area" id="resultArea">
            <h2>🏆 Hasil Latihan</h2>
            <div class="result-score" id="scoreAkhir">0/10</div>
            <div class="result-msg" id="resultMsg"></div>
            <div id="levelBadge" class="result-level"></div>
            
            <div class="review-list" id="reviewList"></div>
            
            <a href="dashboard.html" class="btn-kembali">← Kembali ke Dashboard</a>
            <br>
            <button class="btn-selesai" onclick="ulangiLatihan()">🔄 Ulangi Latihan</button>
        </div>
        
        <div class="footer">
            📖 Bank Soal IPAS Kelas 3 • Bab 1: Keajaiban Tubuhku • 220 Soal (C1-C5)
        </div>
    </div>

    <script src="soal-IPAS-Bab1.js"></script>
    <script>
        // ======= STATE GLOBAL =======
        let currentLevel = null;
        let soalLatihan = [];        // 10 soal acak
        let nomorSaatIni = 0;
        let jawabanUser = [];        // array of {soal, pilihanUser, benar}
        let skor = 0;
        let timerInterval;
        let detikBerjalan = 0;
        
        // Data jumlah soal per level
        const jumlahPerLevel = {
            C1: 60, C2: 50, C3: 45, C4: 35, C5: 30
        };
        
        // ======= FUNGSI UTILITAS =======
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        function formatWaktu(detik) {
            const m = Math.floor(detik / 60);
            const s = detik % 60;
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        
        // ======= PILIH LEVEL =======
        function pilihLevel(level, btn) {
            currentLevel = level;
            
            // aktifkan tombol
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // update info
            const total = jumlahPerLevel[level];
            const label = {
                C1: 'Mengingat', C2: 'Memahami', C3: 'Mengaplikasi', 
                C4: 'Menganalisis', C5: 'Mengevaluasi'
            }[level];
            
            document.getElementById('infoTersedia').innerHTML = 
                `📚 Level <b>${level} (${label})</b>: tersedia <b>${total} soal</b>. 
                Kami akan memilih 10 soal secara acak dari bank soal.`;
            
            // aktifkan tombol mulai
            document.getElementById('btnMulai').disabled = false;
        }
        
        // ======= MULAI LATIHAN =======
        function mulaiLatihan() {
            if (!currentLevel) {
                alert('Silakan pilih level terlebih dahulu!');
                return;
            }
            
            // Ambil 10 soal acak dari level
            const bankLevel = bankSoalIPAS[currentLevel];
            soalLatihan = shuffle(bankLevel).slice(0, 10);
            
            nomorSaatIni = 0;
            jawabanUser = [];
            skor = 0;
            detikBerjalan = 0;
            
            // mulai timer
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                detikBerjalan++;
                document.getElementById('timer').textContent = formatWaktu(detikBerjalan);
            }, 1000);
            
            // tampilkan area kuis
            document.getElementById('levelSelectCard').style.display = 'none';
            document.getElementById('questionArea').classList.add('show');
            document.getElementById('resultArea').classList.remove('show');
            
            tampilkanSoal();
        }
        
        // ======= TAMPILKAN SOAL =======
        function tampilkanSoal() {
            const soal = soalLatihan[nomorSaatIni];
            const container = document.getElementById('questionContainer');
            const total = soalLatihan.length;
            
            // Update progress & skor
            const pct = ((nomorSaatIni) / total) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('skorLive').textContent = skor;
            
            const huruf = ['A', 'B', 'C', 'D', 'E'];
            
            let html = `
                <div class="question-card">
                    <span class="q-number">Soal ${nomorSaatIni + 1} / ${total}</span>
                    <h3>${soal.soal}</h3>
                    <div id="optionsList">
            `;
            
            soal.pilihan.forEach((pil, idx) => {
                html += `
                    <button class="option-btn" onclick="pilihJawaban(${idx})">
                        <span class="option-letter">${huruf[idx]}.</span> ${pil}
                    </button>
                `;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
        }
        
        // ======= PILIH JAWABAN =======
        function pilihJawaban(idx) {
            const soal = soalLatihan[nomorSaatIni];
            const semuaBtn = document.querySelectorAll('.option-btn');
            
            // Tandai semua tombol disabled visual
            const benar = (idx === soal.kunci);
            if (benar) skor++;
            
            // Simpan jawaban
            jawabanUser.push({
                soal: soal.soal,
                pilihan: soal.pilihan,
                pilihanUser: idx,
                kunci: soal.kunci,
                benar: benar
            });
            
            // Tampilkan feedback warna
            semuaBtn.forEach((btn, i) => {
                btn.disabled = true;
                if (i === soal.kunci) {
                    btn.classList.add('correct');
                }
                if (i === idx && idx !== soal.kunci) {
                    btn.classList.add('wrong');
                }
            });
            
            // Update skor live
            document.getElementById('skorLive').textContent = skor;
            
            // Tombol lanjut / selesai
            const btnSelesai = document.getElementById('btnSelesai');
            if (nomorSaatIni < soalLatihan.length - 1) {
                // ganti tombol jadi "Lanjut"
                btnSelesai.innerHTML = '➡️ Soal Berikutnya';
                btnSelesai.onclick = () => {
                    nomorSaatIni++;
                    tampilkanSoal();
                    btnSelesai.innerHTML = '✅ Selesai & Lihat Hasil';
                    btnSelesai.onclick = selesaiLatihan;
                };
            } else {
                btnSelesai.innerHTML = '✅ Selesai & Lihat Hasil';
                btnSelesai.onclick = selesaiLatihan;
            }
        }
        
        // ======= SELESAI LATIHAN =======
        function selesaiLatihan() {
            clearInterval(timerInterval);
            
            // Jika ada soal yang belum dijawab
            if (jawabanUser.length < soalLatihan.length) {
                // tambahkan yang belum dijawab sebagai salah
                for (let i = jawabanUser.length; i < soalLatihan.length; i++) {
                    jawabanUser.push({
                        soal: soalLatihan[i].soal,
                        pilihan: soalLatihan[i].pilihan,
                        pilihanUser: -1,  // tidak dijawab
                        kunci: soalLatihan[i].kunci,
                        benar: false
                    });
                }
            }
            
            // Tampilkan hasil
            document.getElementById('questionArea').classList.remove('show');
            document.getElementById('resultArea').classList.add('show');
            
            const scoreAkhir = jawabanUser.filter(j => j.benar).length;
            const total = soalLatihan.length;
            
            document.getElementById('scoreAkhir').textContent = `${scoreAkhir}/${total}`;
            
            // Pesan & Badge
            const pct = (scoreAkhir / total) * 100;
            let msg, badgeColor, badgeText;
            
            if (pct >= 90) {
                msg = '🌟 Luar biasa! Kamu sangat paham!';
                badgeText = '🏅 SANGAT BAIK';
                badgeColor = 'background:#f59e0b;';
            } else if (pct >= 75) {
                msg = '👍 Bagus sekali! Sedikit lagi sempurna!';
                badgeText = '🎖️ BAGUS';
                badgeColor = 'background:#22c55e;';
            } else if (pct >= 60) {
                msg = '😊 Cukup baik. Ayo tingkatkan lagi!';
                badgeText = '📈 CUKUP';
                badgeColor = 'background:#3b82f6;';
            } else if (pct >= 40) {
                msg = '💪 Jangan menyerah! Coba pelajari lagi dan ulangi.';
                badgeText = '📚 PERLU BELAJAR LAGI';
                badgeColor = 'background:#f97316;';
            } else {
                msg = '📖 Yuk baca lagi materinya, lalu coba lagi ya!';
                badgeText = '💡 MULAI ULANG';
                badgeColor = 'background:#ef4444;';
            }
            
            document.getElementById('resultMsg').textContent = msg;
            
            const badge = document.getElementById('levelBadge');
            badge.textContent = `${badgeText} • Level ${currentLevel}`;
            badge.style.background = badgeColor;
            
            // Tampilkan review
            tampilkanReview();
        }
        
        // ======= REVIEW JAWABAN =======
        function tampilkanReview() {
            const list = document.getElementById('reviewList');
            const huruf = ['A', 'B', 'C', 'D', 'E'];
            let html = '<h3 style="margin:15px 0;color:#333;">📋 Pembahasan:</h3>';
            
            jawabanUser.forEach((j, i) => {
                const warna = j.benar ? '✅' : '❌';
                html += `
                    <div class="review-item">
                        <div class="r-question">${i+1}. ${j.soal}</div>
                `;
                
                j.pilihan.forEach((pil, idx) => {
                    let style = '';
                    if (idx === j.kunci) {
                        style = 'border-left:4px solid #22c55e; padding-left:8px;';
                    }
                    if (idx === j.pilihanUser && !j.benar) {
                        style = 'border-left:4px solid #ef4444; padding-left:8px;';
                    }
                    const mark = (idx === j.kunci) ? ' ✔' : ((idx === j.pilihanUser && !j.benar) ? ' ✘' : '');
                    html += `
                        <div class="r-answer" style="${style}">
                            ${huruf[idx]}. ${pil}${mark}
                        </div>
                    `;
                });
                
                if (!j.benar) {
                    html += `
                        <div class="kunci">
                            💡 Jawaban yang benar: <b>${huruf[j.kunci]}. ${j.pilihan[j.kunci]}</b>
                        </div>
                    `;
                }
                
                html += '</div>';
            });
            
            list.innerHTML = html;
        }
        
        // ======= ULANGI =======
        function ulangiLatihan() {
            document.getElementById('resultArea').classList.remove('show');
            document.getElementById('levelSelectCard').style.display = 'block';
            document.getElementById('questionArea').classList.remove('show');
            
            // reset
            nomorSaatIni = 0;
            jawabanUser = [];
            skor = 0;
            detikBerjalan = 0;
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('skorLive').textContent = '0';
            document.getElementById('btnMulai').disabled = true;
            
            // deselect level
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            currentLevel = null;
            document.getElementById('infoTersedia').innerHTML = 
                '📚 Silakan pilih level untuk melihat jumlah soal yang tersedia.';
        }
    </script>
</body>
</html>
