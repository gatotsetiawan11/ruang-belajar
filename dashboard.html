<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body { color:#e2e8f0; min-height:100vh;
        background: radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%);
    }
    .container { max-width:1100px; margin:0 auto; padding:1.5rem; }
    header { text-align:center; margin-bottom:2rem; }
    header h1 { font-size:1.8rem; }
    header p { margin-top:0.4rem; color:#a5b4fc; }
    .card { background:rgba(30,41,59,0.7); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:1.5rem; }
    .user-info { background:rgba(51,65,85,0.5); display:inline-block; padding:6px 16px; border-radius:20px; margin-top:10px; font-size:14px; }
    .user-info .out { margin-left:10px; color:#fca5a5; cursor:pointer; text-decoration:underline; }
    .grid-mapel { display:grid; grid-template-columns:repeat(5,1fr); gap:1rem; margin-top:1.2rem; }
    .card-mapel { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:1.3rem 0.5rem; text-align:center; cursor:pointer; border-top:5px solid #60a5fa; transition:0.2s; }
    .card-mapel:hover{ transform:translateY(-3px); background:rgba(255,255,255,0.15); }
    .card-mapel .emoji{ font-size:2rem; display:block; margin-bottom:0.4rem; }
    .card-mapel .name{ font-weight:700; color:#fff; }
    .c-ipas{ border-top-color:#fbbf24; }
    .link-admin { margin-top:1.2rem; text-align:center; }

    /* panel admin */
    .admin-wrap { text-align:center; }
    .admin-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1.5rem; max-width:760px; margin-left:auto; margin-right:auto; }
    .admin-card { background:linear-gradient(135deg, rgba(124,58,237,0.25), rgba(59,130,246,0.25)); border:1px solid rgba(167,139,250,0.5); border-radius:14px; padding:1.6rem; cursor:pointer; transition:0.2s; }
    .admin-card:hover{ transform:translateY(-4px); background:linear-gradient(135deg, rgba(124,58,237,0.4), rgba(59,130,246,0.4)); }
    .admin-card .emoji{ font-size:2.2rem; display:block; margin-bottom:0.5rem; }
    .admin-card .t{ font-size:1.05rem; font-weight:800; color:#fff; }
    .admin-card .d{ font-size:0.85rem; color:#ddd6fe; margin-top:0.4rem; line-height:1.4; }
    .logout { background:transparent; border:1px solid #475569; color:#cbd5e1; padding:8px 18px; border-radius:20px; cursor:pointer; margin-top:1rem; }
    .logout:hover{ background:#475569; }
    @media (max-width:700px){ .grid-mapel{grid-template-columns:repeat(2,1fr);} .admin-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1 id="judul">🚀 Dashboard</h1>
        <div class="user-info" id="userInfo">Menghubungkan...</div>
        <div><button class="logout" id="btnLogout">🚪 Keluar</button></div>
    </header>

    <!-- Konten diisi lewat JS berdasarkan role -->
    <div id="content"></div>
</div>

<script>
    function keluar(){ localStorage.removeItem('user'); location.href='auth.html'; }

    function bacaUser(){ try{ return JSON.parse(localStorage.getItem('user')); }catch(e){ return null; } }

    document.addEventListener('DOMContentLoaded', function(){
        const u = bacaUser();
        if (!u || !u.id) { location.href='auth.html'; return; }
        document.getElementById('userInfo').innerHTML = '👤 <b>'+(u.nama||'')+'</b>' + (u.isAdmin || u.developer ? ' <span style="color:#a78bfa;font-size:12px;">(Admin)</span>' : '');
        document.getElementById('btnLogout').onclick = keluar;

        const konten = document.getElementById('content');

        if (u.developer===true || u.isAdmin===true) {
            // ====== DASHBOARD ADMIN ======
            document.title = 'Dashboard Admin';
            document.getElementById('judul').textContent = '🛠️ Dashboard Admin';
            konten.innerHTML =
                '<div class="admin-wrap card">'+
                    '<p style="color:#c7d2fe;font-size:1.05rem;">Selamat datang di <b style="color:#fff;">Panel Admin</b>.</p>'+
                    '<div class="admin-grid">'+
                        '<div class="admin-card" onclick="goAdminKelola()">'+
                            '<span class="emoji">👥</span><div class="t">Kelola Akun Siswa</div>'+
                            '<div class="d">Tambah & hapus akun siswa, ubah PIN.</div>'+
                        '</div>'+
                        '<div class="admin-card" onclick="goAdminLaporan()">'+
                            '<span class="emoji">📊</span><div class="t">Laporan Perkembangan</div>'+
                            '<div class="d">Lihat perkembangan belajar tiap siswa.</div>'+
                        '</div>'+
                    '</div>'+
                '</div>';
            // Simpan ke localStorage agar admin.html tahu modus
            window.goAdminKelola = function(){ location.href='admin.html?tab=kelola'; };
            window.goAdminLaporan = function(){ location.href='admin.html?tab=laporan'; };
        } else {
            // ====== DASHBOARD SISWA ======
            document.title = 'Pilih Mata Pelajaran';
            konten.innerHTML = renderMapelSiswa();
        }
    });

    function renderMapelSiswa(){
        const mapel = [
            {emoji:'🔬', nama:'IPAS', bab:'bukaIPAS', kelas:'c-ipas'},
            {emoji:'🦅', nama:'Pancasila', opsiPesan:'belum' },
            {emoji:'➕', nama:'Matematika', opsiPesan:'belum' },
            {emoji:'📖', nama:'Bahasa Indonesia', opsiPesan:'belum' },
            {emoji:'🌍', nama:'Bahasa Inggris', opsiPesan:'belum' }
        ];
        let h='<h2 style="text-align:center;color:#e0e7ff;margin-bottom:0.5rem;">Pilih Mata Pelajaran</h2>';
        h+='<p style="text-align:center;color:#94a3b8;margin-bottom:1rem;">Selesaikan level untuk membuka level berikutnya.</p>';
        h+='<div class="grid-mapel">';
        mapel.forEach(m=>{
            if(m.nama==='IPAS'){
                h+='<div class="card-mapel c-ipas" onclick="pilihBab(1)"><span class="emoji">'+m.emoji+'</span><div class="name">'+m.nama+'</div></div>';
            } else {
                h+='<div class="card-mapel" onclick="belumTersedia(\''+m.nama+'\')"><span class="emoji">'+m.emoji+'</span><div class="name">'+m.nama+'</div></div>';
            }
        });
        h+='</div>';
        return h;
    }

    window.belumTersedia = function(n){ alert('👷 '+n+' belum tersedia pada versi ini. Saat ini hanya IPAS yang aktif.'); };
    window.pilihBab = function(b){ location.href='latihan.html?mapel=IPAS&bab='+b; };
</script>
</body>
</html>
