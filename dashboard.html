<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruang Belajar · Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1 class="brand">📚 Ruang Belajar</h1>
        <p class="greet" id="greet">Halo!</p>
      </div>
      <div class="userbox">
        <span class="badge-kelas" id="kelasBadge">-</span>
        <button id="logoutBtn" class="btn-outline">Keluar</button>
      </div>
    </header>

    <main class="content">
      <section class="progress-summary card">
        <div><b id="statLulus">0</b><span>Latihan Lulus</span></div>
        <div><b id="statActive">0</b><span>Bab Aktif</span></div>
        <div><b id="statTotal">0</b><span>Total Latihan</span></div>
      </section>

      <h2 class="section-title">Pilih Bab untuk Mulai Belajar</h2>
      <div id="chapterList" class="chapter-list"></div>
    </main>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
