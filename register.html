<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar / Aktivasi - Latihan Siswa</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-shell">

        <section class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo">✕</div>
                <div>
                    <h1>Latihan Siswa</h1>
                    <p>Belajar dan berlatih sesuai kemampuanmu.</p>
                </div>
            </div>


            <!-- ============================================= -->
            <!-- MODE: LIVESTATUS BAR (self vs activation)     -->
            <!-- ============================================= -->
            <div class="mode-banner">
                <span id="modeBadge" class="auth-badge">Pendaftaran</span>
                <p id="modeTitle" class="mode-title"></p>
                <p id="modeDesc" class="mode-desc"></p>
            </div>


            <!-- ============================================= -->
            <!-- FORM DATA SISWA (self-register)               -->
            <!-- ============================================= -->
            <form id="dataForm" class="auth-section" autocomplete="off" novalidate>

                <div class="form-group">
                    <label for="regName">Nama Lengkap</label>
                    <input id="regName" class="auth-input" type="text"
                           placeholder="Nama lengkap siswa" required>
                </div>

                <div class="form-group">
                    <label for="regClass">Kelas</label>
                    <input id="regClass" class="auth-input" type="text"
                           placeholder="contoh: 2 atau 4A" required>
                </div>

                <div class="form-group">
                    <label>Identitas (minimal salah satu)</label>
                    <input id="regNisn" class="auth-input"
                           type="text" inputmode="numeric"
                           placeholder="NISN 10 digit (opsional bila ada WA/email)">
                    <p class="field-help">Isi minimal satu: NISN, WhatsApp, atau email.</p>
                </div>

                <div class="form-group">
                    <input id="regPhone" class="auth-input"
                           type="tel" inputmode="tel"
                           placeholder="Nomor WhatsApp (opsional)">
                </div>

                <div class="form-group">
                    <input id="regEmail" class="auth-input"
                           type="email" inputmode="email"
                           placeholder="Email (opsional)">
                </div>

                <div id="regDataMessage" class="auth-message" hidden></div>

                <button id="regButton" class="auth-primary-button" type="submit">
                    Daftar
                </button>

            </form>


            <!-- ============================================= -->
            <!-- FORM SET PIN BARU (activation & self PIN)     -->
            <!-- ============================================= -->
            <form id="pinForm" class="auth-section" autocomplete="off" novalidate hidden>

                <div class="identity-box">
                    <div class="identity-item">
                        <span class="identity-label">Nama</span>
                        <strong id="confirmName" class="identity-value">-</strong>
                    </div>
                    <div class="identity-item">
                        <span class="identity-label">Identitas</span>
                        <strong id="confirmIdentity" class="identity-value">-</strong>
                    </div>
                </div>

                <div class="step-note" id="modeNote">
                    <!-- dinamis: pesan utk aktifkan / atur pin baru -->
                </div>

                <div class="form-group">
                    <label for="regPin">PIN Baru (6 digit)</label>
                    <input id="regPin" class="auth-input"
                           type="password" inputmode="numeric"
                           pattern="[0-9]*" maxlength="6"
                           placeholder="6 digit PIN" required>
                </div>

                <div class="form-group">
                    <label for="regPinConfirm">Ulangi PIN</label>
                    <input id="regPinConfirm" class="auth-input"
                           type="password" inputmode="numeric"
                           pattern="[0-9]*" maxlength="6"
                           placeholder="Ulangi PIN" required>
                </div>

                <div id="regPinMessage" class="auth-message" hidden></div>

                <button id="submitPinButton" class="auth-primary-button" type="submit">
                    Simpan
                </button>

            </form>


            <div class="auth-secondary-action">
                <a id="backToLogin" href="index.html">Kembali ke login</a>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/register.js"></script>

</body>
</html>
