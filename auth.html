<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar & Masuk</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body {
            background: radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:20px; color:#e2e8f0;
        }
        .box {
            background: rgba(30,41,59,0.85); border:1px solid rgba(148,163,184,0.25);
            border-radius:18px; padding:35px 30px; width:100%; max-width:420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        h1 { text-align:center; font-size:24px; margin-bottom:5px; }
        .sub { text-align:center; color:#94a3b8; font-size:14px; margin-bottom:25px; }
        label { display:block; font-size:13px; color:#cbd5e1; margin:14px 0 5px; }
        input {
            width:100%; padding:12px; border-radius:10px; font-size:15px;
            border:1px solid #3b4a63; background: rgba(15,23,42,0.6);
            color:#fff; outline:none;
        }
        input:focus { border-color:#818cf8; }
        button {
            width:100%; background: linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff; padding:14px; border:none; border-radius:12px;
            font-size:17px; font-weight:bold; cursor:pointer; margin-top:20px;
        }
        button:hover { opacity:0.9; }
        .msg { margin-top:15px; text-align:center; font-size:14px; min-height:20px; }
        .msg .err { color:#f87171; }
        .msg .ok  { color:#4ade80; }
        .daftar-link { text-align:center; margin-top:15px; font-size:14px; }
        .daftar-link a { color:#a5b4fc; text-decoration:none; }
        .daftar-link a:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="box">
    <h1>✏️ SOAL SOAL LATIHAN</h1>
    <div class="sub">TINGKAT SEKOLAH DASAR</div>

    <!-- ====== HALAMAN DAFTAR ====== -->
    <div class="daftar-area" id="daftarArea" style="display:block;">
        <div style="text-align:center; margin-bottom:8px;">
            <strong style="color:#a78bfa;">📝 Daftar Akun Baru</strong>
        </div>

        <label>Nama Lengkap</label>
        <input id="namaBaru" type="text" placeholder="Ketik nama lengkap kamu..." maxlength="50">

        <label>Buat PIN (6 digit)</label>
        <input id="pinBaru" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

        <button onclick="daftar()">✅ Daftar & Masuk</button>

        <div class="msg" id="pesanDaftar"></div>

        <div class="daftar-link">
            Sudah punya akun? <a href="#" onclick="keLogin(event)">Masuk</a>
        </div>
    </div>

    <!-- ====== HALAMAN LOGIN ====== -->
    <div class="login-area" id="loginArea" style="display:none;">
        <div style="text-align:center; margin-bottom:8px;">
            <strong style="color:#a78bfa;">🔎 Masuk</strong>
        </div>

        <label>Nama Lengkap</label>
        <input id="namaLogin" type="text" maxlength="50">

        <label>PIN (6 digit)</label>
        <input id="pinLogin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

        <button onclick="login()">🚪 Masuk</button>

        <div class="msg" id="pesanLogin"></div>

        <div class="daftar-link">
            Belum punya akun? <a href="#" onclick="keDaftar(event)">Daftar di sini</a>
        </div>
    </div>
</div>

<!-- 🔑 Tombol Developer Siluman: KECIL + TRANSPARAN, langsung masuk (tanpa prefill) -->
<div style="position:fixed; bottom:6px; left:6px; z-index:999; opacity:0.28;">
    <button type="button" onclick="masukDeveloper(event)"
            style="background:transparent; border:1px solid rgba(148,163,184,0.25);
                   color:#94a3b8; font-size:10px; padding:2px 7px; border-radius:5px;
                   cursor:pointer; line-height:1.2;">dev</button>
</div>

<script>
    // ================= UTILITAS =================
    async function sha256(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    // Normalisasi nama: "budi santoso" => "Budi Santoso" (huruf pertama tiap kata besar)
    function normalisasiNama(nama) {
        return nama
            .toLowerCase()
            .split(/\s+/)
            .filter(function(k){ return k.length > 0; })
            .map(function(k){ return k.charAt(0).toUpperCase() + k.slice(1); })
            .join(' ');
    }

    // ============ MASUK SEBAGAI PENGEMBANG (siluman, tanpa isi field) ============
    function masukDeveloper(e) {
        if (e) e.preventDefault();
        const devUser = {
            id        : 'DEV-428687',
            nama      : 'Gatot Setiawan',
            pinHash   : '',
            developer : true
        };
        localStorage.setItem('user', JSON.stringify(devUser));
        location.href = 'dashboard.html';
    }

    // ============ DAFTAR ============
    async function daftar() {
        const nama  = document.getElementById('namaBaru').value.trim();
        const pin   = document.getElementById('pinBaru').value.trim();
        const pesan = document.getElementById('pesanDaftar');

        pesan.innerHTML = '';
        if (!nama) { pesan.innerHTML='<span class="err">Nama tidak boleh kosong</span>'; return; }
        if (!/^\d{6}$/.test(pin)) { pesan.innerHTML='<span class="err">PIN harus 6 digit angka</span>'; return; }

        // Nama developer tidak boleh didaftar lewat form biasa (case-insensitive)
        if (nama.toLowerCase() === 'gatot setiawan') {
            pesan.innerHTML='<span class="err">Nama tersebut tidak dapat didaftarkan. Silakan masuk.</span>';
            keLogin(null);
            return;
        }

        const pinHash = await sha256(pin);
        const user = { id: 'U' + Date.now(), nama: normalisasiNama(nama), pinHash: pinHash };

        const pengguna = JSON.parse(localStorage.getItem('pengguna') || '[]');
        const ada = pengguna.find(u => u.nama.toLowerCase() === nama.toLowerCase());
        if (ada) {
            pesan.innerHTML='<span class="err">Nama sudah terdaftar. Silakan Masuk.</span>';
            keLogin(null);
            return;
        }
        pengguna.push(user);
        localStorage.setItem('pengguna', JSON.stringify(pengguna));

        localStorage.setItem('user', JSON.stringify(user));
        pesan.innerHTML='<span class="ok">✅ Akun dibuat! Mengarahkan ke dashboard...</span>';
        setTimeout(()=> location.href='dashboard.html', 1000);
    }

    // ============ LOGIN (nama TIDAK case-sensitive) ============
    async function login() {
        const nama  = document.getElementById('namaLogin').value.trim();
        const pin   = document.getElementById('pinLogin').value.trim();
        const pesan = document.getElementById('pesanLogin');

        pesan.innerHTML = '';
        if (!nama) { pesan.innerHTML='<span class="err">Masukkan nama</span>'; return; }
        if (!/^\d{6}$/.test(pin)) { pesan.innerHTML='<span class="err">PIN harus 6 digit angka</span>'; return; }

        // Akses Developer lewat form (nama tidak case-sensitive)
        if (nama.toLowerCase() === 'gatot setiawan' && pin === '428687') {
            const devUser = {
                id        : 'DEV-428687',
                nama      : 'Gatot Setiawan',
                pinHash   : '',
                developer : true
            };
            localStorage.setItem('user', JSON.stringify(devUser));
            pesan.innerHTML='<span class="ok">✅ Masuk sebagai Pengembang!</span>';
            setTimeout(()=> location.href='dashboard.html', 800);
            return;
        }

        const pengguna = JSON.parse(localStorage.getItem('pengguna') || '[]');
        const user = pengguna.find(u => u.nama.toLowerCase() === nama.toLowerCase());
        if (!user) {
            pesan.innerHTML='<span class="err">Nama tidak ditemukan. Silakan Daftar.</span>';
            return;
        }
        const pinHash = await sha256(pin);
        if (user.pinHash !== pinHash) {
            pesan.innerHTML='<span class="err">❌ PIN salah</span>';
            return;
        }
        localStorage.setItem('user', JSON.stringify(user));
        pesan.innerHTML='<span class="ok">✅ Berhasil masuk! Mengarahkan...</span>';
        setTimeout(()=> location.href='dashboard.html', 1000);
    }

    // ============ NAVIGASI ============
    function keLogin(e) {
        if (e) e.preventDefault();
        document.getElementById('daftarArea').style.display='none';
        document.getElementById('loginArea').style.display='block';
        document.getElementById('namaLogin').value = '';   // selalu kosong
        document.getElementById('pinLogin').value = '';
    }
    function keDaftar(e) {
        if (e) e.preventDefault();
        document.getElementById('daftarArea').style.display='block';
        document.getElementById('loginArea').style.display='none';
        document.getElementById('namaBaru').value = '';
        document.getElementById('pinBaru').value = '';
    }
</script>
</body>
</html>
