<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Daftar</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body {
            background: radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:20px; color:#e2e8f0;
        }
        .box {
            background: rgba(30,41,59,0.85); border:1px solid rgba(148,163,184,0.25);
            border-radius:18px; padding:35px 30px; width:100%; max-width:420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        h1 { text-align:center; font-size:24px; margin-bottom:5px; }
        .sub { text-align:center; color:#94a3b8; font-size:14px; margin-bottom:25px; }
        label { display:block; font-size:13px; color:#cbd5e1; margin:14px 0 5px; }
        input {
            width:100%; padding:12px; border-radius:10px; font-size:15px;
            border:1px solid #3b4a63; background: rgba(15,23,42,0.6);
            color:#fff; outline:none;
        }
        input:focus { border-color:#818cf8; }
        .btn {
            display:block; width:100%; background: linear-gradient(135deg,#6366f1,#8b5cf6);
            color:#fff; padding:14px; border:none; border-radius:12px;
            font-size:17px; font-weight:bold; cursor:pointer; margin-top:20px; text-align:center;
        }
        .btn:hover { opacity:0.9; }
        .field-wrap { position:relative; }
        .saran-box {
            position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50;
            background: rgba(15,23,42,0.97); border:1px solid #3b4a63; border-radius:10px;
            max-height:180px; overflow-y:auto; box-shadow:0 10px 24px rgba(0,0,0,0.5); display:none;
        }
        .saran-item { padding:10px 14px; cursor:default; user-select:none; border-bottom:1px solid rgba(148,163,184,0.08); }
        .saran-item:last-child { border-bottom:none; }
        .saran-item .s-nama { color:#e2e8f0; font-size:14px; }
        .saran-tip { color:#94a3b8; font-size:12px; padding:8px 14px; }
        .saran-empty { color:#94a3b8; padding:10px 14px; font-size:13px; font-style:italic; }
        .panel { display:none; }
        .panel.active { display:block; }
        .msg { margin-top:15px; text-align:center; font-size:14px; min-height:20px; }
        .msg .err { color:#f87171; }
        .msg .ok  { color:#4ade80; }
        .switch-link { text-align:center; margin-top:15px; font-size:14px; }
        .switch-link a { color:#a5b4fc; text-decoration:none; }
        .switch-link a:hover { text-decoration:underline; }
    </style>
</head>
<body>

<div class="box">
    <h1>✏️ SOAL SOAL LATIHAN</h1>
    <div class="sub">TINGKAT SEKOLAH DASAR</div>

    <!-- ====== LOGIN ====== -->
    <div class="panel active" id="loginArea">
        <div style="text-align:center; margin-bottom:8px;"><strong style="color:#a78bfa;">🔎 Masuk</strong></div>

        <label>Nama Lengkap</label>
        <div class="field-wrap">
            <input id="namaLogin" type="text" maxlength="50" autocomplete="off"
                   oninput="cariSaran(this.value,'saranLogin')" onfocus="cariSaran(this.value,'saranLogin')"
                   onblur="tutupSaran('saranLogin')">
            <div class="saran-box" id="saranLogin"></div>
        </div>

        <label>PIN (6 digit)</label>
        <input id="pinLogin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

        <button class="btn" onclick="login()">🚪 Masuk</button>
        <div class="msg" id="pesanLogin"></div>

        <div class="switch-link">Belum punya akun? <a href="#" onclick="keDaftar(event)">Daftar di sini</a></div>
    </div>

    <!-- ====== DAFTAR ====== -->
    <div class="panel" id="daftarArea">
        <div style="text-align:center; margin-bottom:8px;"><strong style="color:#a78bfa;">📝 Daftar Akun Baru</strong></div>

        <label>Nama Lengkap</label>
        <div class="field-wrap">
            <input id="namaBaru" type="text" maxlength="50" autocomplete="off"
                   placeholder="Ketik nama lengkap kamu..."
                   oninput="cariSaran(this.value,'saranDaftar',true)" onfocus="cariSaran(this.value,'saranDaftar',true)"
                   onblur="tutupSaran('saranDaftar')">
            <div class="saran-box" id="saranDaftar"></div>
        </div>

        <label>Buat PIN (6 digit)</label>
        <input id="pinBaru" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">

        <button class="btn" onclick="daftar()">✅ Daftar & Masuk</button>
        <div class="msg" id="pesanDaftar"></div>

        <div class="switch-link">Sudah punya akun? <a href="#" onclick="keLogin(event)">Masuk</a></div>
    </div>
</div>

<script>
    // ============ KREDENSIAL ADMIN ============
    const ADMIN_NAMA = 'Gatot Setiawan';
    const ADMIN_PIN  = '428687';

    // Ambang minimal karakter sebelum saran muncul (bantu mengingat)
    const MIN_KARAKTER_SARAN = 3;

    // ============ UTILITAS ============
    async function sha256(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    function normalisasiNama(nama) {
        return nama.toLowerCase().split(/\s+/).filter(k=>k.length).map(k=>k.charAt(0).toUpperCase()+k.slice(1)).join(' ');
    }
    function daftarPengguna() {
        try { return JSON.parse(localStorage.getItem('pengguna'))||[]; }
        catch(e) { return []; }
    }

    // ============ SARAN NAMA (PASIF - hanya pengingat, TIDAK bisa diklik) ============
    function cariSaran(ketik, boxId, modeDaftar) {
        const box = document.getElementById(boxId);
        if (!box) return;
        // Baru tampilkan saran setelah minimal 3 karakter
        if (!ketik || ketik.trim().length < MIN_KARAKTER_SARAN) {
            box.style.display='none'; box.innerHTML=''; return;
        }
        const k = ketik.trim().toLowerCase();
        const semua = daftarPengguna();
        const cocok = semua.filter(u=> u.nama && u.nama.toLowerCase().indexOf(k)!==-1 );
        if (cocok.length===0) {
            box.innerHTML='<div class="saran-empty">Tidak ada nama yang cocok.</div>';
        }
        else {
            let h='';
            cocok.slice(0,5).forEach(u=>{
                if (modeDaftar) {
                    h += '<div class="saran-item"><div class="s-nama">👤 '+u.nama+'</div>' +
                         '<div style="color:#fca5a5;font-size:12px;margin-top:2px;">⚠ Nama sudah terdaftar.</div></div>';
                } else {
                    h += '<div class="saran-item"><div class="s-nama">🔸 '+u.nama+'</div></div>';
                }
            });
            if (!modeDaftar) h += '<div class="saran-tip">✍️ Ketik nama lengkap dan masukkan PIN Anda.</div>';
            box.innerHTML = h;
        }
        box.style.display='block';
    }
    function tutupSaran(boxId){ setTimeout(()=>{ const b=document.getElementById(boxId); if(b){b.style.display='none';} },200); }

    // ============ DAFTAR ============
    async function daftar(prefilledNama) {
        const inpNama = document.getElementById('namaBaru');
        // Jika dipanggil dari alih-login, isikan nama yang diketik tadi
        if (prefilledNama && !inpNama.value.trim()) inpNama.value = normalisasiNama(prefilledNama);

        const nama  = inpNama.value.trim();
        const pin   = document.getElementById('pinBaru').value.trim();
        const pesan = document.getElementById('pesanDaftar');
        pesan.innerHTML='';
        if (!nama) { pesan.innerHTML='<span class="err">Nama tidak boleh kosong</span>'; return; }
        if (!/^\d{6}$/.test(pin)) { pesan.innerHTML='<span class="err">PIN harus 6 digit angka</span>'; return; }
        if (nama.toLowerCase() === ADMIN_NAMA.toLowerCase()) {
            pesan.innerHTML='<span class="err">Nama tersebut tidak dapat didaftarkan. Silakan masuk.</span>';
            keLogin(null); return;
        }
        const pinHash = await sha256(pin);
        const user = { id:'U'+Date.now(), nama: normalisasiNama(nama), pinHash: pinHash };
        const pengguna = JSON.parse(localStorage.getItem('pengguna')||'[]');
        const ada = pengguna.find(u=>u.nama.toLowerCase()===nama.toLowerCase());
        if (ada) { pesan.innerHTML='<span class="err">Nama sudah terdaftar. Silakan Masuk.</span>'; keLogin(null); return; }
        pengguna.push(user);
        localStorage.setItem('pengguna', JSON.stringify(pengguna));
        localStorage.setItem('user', JSON.stringify(user));
        pesan.innerHTML='<span class="ok">✅ Akun dibuat! Mengarahkan ke dashboard...</span>';
        setTimeout(()=> location.href='dashboard.html', 1000);
    }

    // ============ LOGIN ============
    async function login() {
        const nama  = document.getElementById('namaLogin').value.trim();
        const pin   = document.getElementById('pinLogin').value.trim();
        const pesan = document.getElementById('pesanLogin');
        const inpDaftar = document.getElementById('namaBaru');
        pesan.innerHTML='';
        if (!nama) { pesan.innerHTML='<span class="err">Masukkan nama</span>'; return; }
        if (!/^\d{6}$/.test(pin)) { pesan.innerHTML='<span class="err">PIN harus 6 digit angka</span>'; return; }

        // Deteksi otomatis: kredensial admin
        if (nama.toLowerCase()===ADMIN_NAMA.toLowerCase() && pin===ADMIN_PIN) {
            const adminUser = { id:'ADMIN', nama: ADMIN_NAMA, pinHash:'', developer:true, isAdmin:true };
            localStorage.setItem('user', JSON.stringify(adminUser));
            pesan.innerHTML='<span class="ok">✅ Selamat datang, Admin!</span>';
            setTimeout(()=> location.href='dashboard.html', 800);
            return;
        }

        // Login siswa biasa
        const pengguna = JSON.parse(localStorage.getItem('pengguna')||'[]');
        const user = pengguna.find(u=>u.nama.toLowerCase()===nama.toLowerCase());

        // ===== Jika nama tidak ditemukan -> arahkan otomatis ke panel Daftar =====
        if (!user) {
            // Pindah fokus ke panel daftar, nama login otomatis dibawa masuk
            keDaftar(null);
            inpDaftar.value = normalisasiNama(nama);
            inpDaftar.focus();
            // Tampilkan petunjuk pendaftaran
            const pesanDaftar = document.getElementById('pesanDaftar');
            pesanDaftar.innerHTML =
                '<span style="color:#a5b4fc;">🔎 "<b>' + normalisasiNama(nama) +
                '</b>" belum terdaftar. Lengkapi PIN untuk membuat akun baru.</span>';
            pesanDaftar.scrollIntoView({ behavior:'smooth', block:'center' });
            return;
        }

        // Cek PIN
        const pinHash = await sha256(pin);
        if (user.pinHash !== pinHash) { pesan.innerHTML='<span class="err">❌ PIN salah</span>'; return; }
        localStorage.setItem('user', JSON.stringify(user));
        pesan.innerHTML='<span class="ok">✅ Berhasil masuk! Mengarahkan...</span>';
        setTimeout(()=> location.href='dashboard.html', 1000);
    }

    // ============ NAVIGASI ============
    function keLogin(e){ if(e)e.preventDefault(); kosongkanSemua(); document.getElementById('loginArea').classList.add('active'); document.getElementById('daftarArea').classList.remove('active'); }
    function keDaftar(e){
        if(e)e.preventDefault();
        // Jangan kosongkan field sebelum diarahkan otomatis, biar nama tetap terbawa
        document.getElementById('namaBaru').value = '';   // dikosongkan dulu, isi oleh pemicu alih-login
        document.getElementById('pinBaru').value = '';
        document.getElementById('pesanLogin').innerHTML='';
        document.getElementById('pesanDaftar').innerHTML='';
        document.getElementById('saranLogin').style.display='none';
        document.getElementById('saranDaftar').style.display='none';
        document.getElementById('daftarArea').classList.add('active');
        document.getElementById('loginArea').classList.remove('active');
    }
    function kosongkanSemua(){
        ['namaLogin','pinLogin','namaBaru','pinBaru'].forEach(id=>document.getElementById(id).value='');
        ['saranLogin','saranDaftar'].forEach(id=>document.getElementById(id).style.display='none');
        document.getElementById('pesanLogin').innerHTML='';
        document.getElementById('pesanDaftar').innerHTML='';
    }
</script>
</body>
</html>
